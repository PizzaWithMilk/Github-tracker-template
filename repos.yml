# ============================================================
# GLOBAL SETTINGS
# ============================================================

webhook: "YOUR_DISCORD_WEBHOOK_URL_HERE"
ping_mode: user   # modes: user, role, everyone, none
ping_id: YOUR_DISCORD_USER_ID_HERE
github_api_base_url: "https://api.github.com"      # GitHub Enterprise Server API base if needed
commit_accent_color: "5865F2"
release_accent_color: "FEE75C"

# ============================================================
# OPTIONAL STATS DASHBOARD
# ============================================================

stats_enabled: true
stats_webhook: "YOUR_DISCORD_WEBHOOK_URL_HERE"     # required if stats_enabled: true

# ============================================================
# INCIDENTS/ERRORS
# ============================================================

incident_webhook: "YOUR_DISCORD_WEBHOOK_URL_HERE" 
incident_ping_mode: none    # modes: user, role, everyone, none
incident_ping_id: "YOUR_DISCORD_USER_ID_HERE"  

# ============================================================
# REPOSITORIES
# ============================================================
# you don't need to copy all 7 examples below. If you're only going to monitor 1 repo then only use 1 of the examples. Just make sure the repo you're monitoring is under "repos:"
repos: 
  - repo: owner/repo2
    type: forum
    monitor: releases
    accent_color: FFFFFF
    include_release_assets: true
    short_summary: true
    summary_lines: 16
    ping: role
    ping_id: YOUR_DISCORD_ROLE_ID_HERE
    tags:
      - YOUR_DISCORD_TAG_ID_HERE

  - repo: owner/repo2
    type: forum
    monitor: commits
    accent_color: 337fd5
    ping: role
    ping_id: YOUR_DISCORD_ROLE_ID_HERE
    tags:
      - YOUR_DISCORD_TAG_ID_HERE

  - repo: owner/repo3
    type: forum
    monitor: releases
    ping: everyone
    accent_color: 4f82ff
    include_release_assets: true
    short_summary: true
    summary_lines: 16
    tags:
      - YOUR_DISCORD_TAG_ID_HERE
    
  - repo: owner/repo4
    type: normal
    monitor: commits
    accent_color: 9260ce
    ping: user
    ping_id: YOUR_DISCORD_USER_ID_HERE

  - repo: owner/repo5
    type: normal
    monitor: releases
    accent_color: 212121
    ping: user
    ping_id: YOUR_DISCORD_USER_ID_HERE
  
  - repo: owner/repo6
    type: normal
    monitor: releases
    include_release_assets: true
    accent_color: FFFFFF
    ping: user
    ping_id: YOUR_DISCORD_USER_ID_HERE
 
  - repo: owner/repo7
    type: normal
    monitor: releases
    include_release_assets: true
    accent_color: 00B331
    ping: user
    ping_id: YOUR_DISCORD_USER_ID_HERE
