# ============================================================================
# Shared repo + ping configuration, read by all four monitor workflows.
# Save this file at: config/repos.yml  (or wherever CONFIG_FILE points)
# ============================================================================

# Defaults used by any repo below that doesn't set its own ping/ping_id,
# and by the 59-day inactivity reminder.
ping_mode: user                          # user | role | everyone | none
ping_id: "YOUR_DISCORD_USER_ID_HERE"     # required only when ping_mode is user or role. also used for workflow re-enable reminder

repos:
  # Examples below
  
   # Inherits the global role ping
   - repo: owner/project-one
     type: normal
     monitor: releases

  # Overrides the global ping with a specific user
   - repo: owner/project-two
     type: normal
     monitor: releases
     ping: user
     ping_id: 222222222222222222

  # Overrides the global ping with @everyone
   - repo: owner/project-three
     type: normal
     monitor: releases
     ping: everyone

  # Disables pinging entirely
   - repo: owner/project-four
     type: normal
     monitor: releases
     ping: none

  # Uses a different role ID but keeps the global role mode
   - repo: owner/project-five
     type: normal
     monitor: releases
     ping_id: 333333333333333333

  # Forum repository using global ping
   - repo: owner/project-six
     type: forum
     monitor: commits
     tags:
      - 111111111111111111

  # Forum + user + multiple tags
   - repo: owner/project-seven
     type: forum
     monitor: commits
     ping: user
     ping_id: 444444444444444444
     tags:
       - 111111111111111111
       - 222222222222222222
       - 333333333333333333

  # Forum + no ping + five tags
   - repo: owner/project-eight
     type: forum
     monitor: commits
     ping: none
     tags:
       - 111111111111111111
       - 222222222222222222
       - 333333333333333333
       - 444444444444444444
       - 555555555555555555
