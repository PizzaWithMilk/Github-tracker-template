
name: Repo Monitor

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - ".github/monitor-state/**"
  pull_request:
    paths-ignore:
      - ".github/monitor-state/**"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && 'repo-monitor' || 'repo-monitor-validation' }}
      cancel-in-progress: false
    env:
      CONFIG_FILE: "config/repos.yml"
      STATE_DIR: ".github/monitor-state"
      NOTIFY_ON_INITIAL_RUN: "true"


    steps:
      - name: Checkout monitor state
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          persist-credentials: true

      - name: Show validation context
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Config path: ${{ env.CONFIG_FILE }}"
          echo "Workspace config/ and workflows:"
          ls -la config 2>/dev/null || echo "(no config/ directory)"
          ls -la .github/workflows 2>/dev/null || echo "(no .github/workflows directory)"
          if [ -f "${{ env.CONFIG_FILE }}" ]; then
            echo "Config file exists: ${{ env.CONFIG_FILE }}"
            wc -l "${{ env.CONFIG_FILE }}"
          else
            echo "::error::Config file missing at ${{ env.CONFIG_FILE }}"
            exit 1
          fi

      - name: Restore stats dashboard message cache
        id: stats-cache
        uses: actions/cache/restore@v4
        with:
          path: .github/monitor-state/_stats.cache.json
          key: repo-monitor-stats-msg-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            repo-monitor-stats-msg-

      - name: Validate config / check for new commits and releases
        id: monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_MESSAGE_CACHE: .github/monitor-state/_stats.cache.json
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error
          import threading
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import parse_qsl, urlencode, urlparse, urlunparse
          from pathlib import Path
          
          CONFIG_FILE = Path(os.environ.get("CONFIG_FILE", "config/repos.yml"))
          STATE_DIR = Path(os.environ.get("STATE_DIR", ".github/monitor-state"))
          REPO = ""
          PROJECT_NAME = ""
          API_URL = ""
          CURRENT_WEBHOOK = ""
          CURRENT_API_BASE_URL = ""
          CURRENT_GITHUB_WEB_BASE_URL = ""
          CURRENT_ACCENT_COLOR = None
          CURRENT_RELEASE_ASSETS = True
          CURRENT_SHORT_SUMMARY = False
          CURRENT_SUMMARY_LINES = 8
          STATS_ENABLED = False
          STATS_WEBHOOK = ""
          STATS_STATE_PATH = STATE_DIR / "_stats.json"
          STATS_LIFETIME_PATH = STATE_DIR / "_lifetime.json"
          STATS_MESSAGE_CACHE = Path(os.environ.get("STATS_MESSAGE_CACHE", str(STATE_DIR / "_stats.cache.json")))
          STATS_WEBHOOK_FINGERPRINT = ""
          LIFETIME_COUNTER_KEYS = (
              "runs",
              "commits_detected",
              "releases_detected",
              "discord_notifications",
              "forum_posts",
              "errors",
          )
          MONITOR_KIND = ""
          CURRENT_REPO_TYPE = "normal"
          
          GITHUB_TOKEN = os.environ.get("GITHUB_TOKEN", "")
          NOTIFY_ON_INITIAL_RUN = os.environ.get("NOTIFY_ON_INITIAL_RUN", "true").strip().lower() not in ("false", "0", "no")
          
          STATE = None
          
          THREAD_STATE = None
          DELIVERY_STATE = None
          TOTAL_MESSAGE_BUDGET = 3800
          MAX_TOTAL_COMPONENTS = 36
          FIRST_FIXED_COMPONENTS = 6
          CONTINUATION_FIXED_COMPONENTS = 1
          CONTINUATION_LABEL_OVERHEAD = 80
          MIN_CHUNK = 200
          MAX_COMMITS_PER_RUN = 10
          MAX_RELEASES_PER_RUN = 10
          MAX_RELEASE_ASSETS_LISTED = 10
          RETRY_ATTEMPTS = 3
          RETRY_BACKOFF_SECONDS = 3
          RATE_LIMIT_RETRY_ATTEMPTS = 5
          RATE_LIMIT_MAX_WAIT_SECONDS = 15
          DISCORD_SEND_DELAY_SECONDS = 0.5
          SCHEDULE_INTERVAL_SECONDS = 5 * 60
          MAX_STATS_TEXT_LENGTH = 3900
          FAILURE_ALERT_THRESHOLD = 3
          RATE_LIMIT_ALERT_THRESHOLD = 3
          GITHUB_RATE_LIMIT_MAX_WAIT_SECONDS = 30
          MAX_GITHUB_PREFETCH_WORKERS = 6
          _last_discord_send_at = {"t": None}
          GITHUB_RATE_LIMIT_INFO = {
              "remaining": None,
              "limit": None,
              "reset": None,
              "observed_at": None,
          }
          _github_rate_limit_lock = threading.Lock()
          PREFETCH_CACHE = {}
          
          
          class GitHubPermanentError(RuntimeError):
              """A GitHub API error that will not be fixed by retrying this run."""
          
              def __init__(self, status, message):
                  super().__init__(message)
                  self.status = status
          
          
          class GitHubRateLimitError(RuntimeError):
              """GitHub's primary REST API rate limit is exhausted."""
          
              def __init__(self, reset_epoch=None, message="GitHub API primary rate limit exhausted"):
                  super().__init__(message)
                  self.reset_epoch = reset_epoch


          class GitHubNotModified(Exception):
              """GitHub returned HTTP 304 Not Modified for a conditional request."""
          
          
          class DiscordPermanentError(RuntimeError):
              """A Discord webhook error that is not expected to recover without configuration changes."""
          
              def __init__(self, status, message):
                  super().__init__(message)
                  self.status = status
                  self.service = "discord"
          
          
          class DiscordThreadGoneError(RuntimeError):
              """The saved Discord Forum thread no longer exists."""
          
              def __init__(self, status, message):
                  super().__init__(message)
                  self.status = status
                  self.service = "discord"
          
          
          
          
          def strip_config_value(raw_value):
              """Strip a trailing comment while safely handling quoted values."""
              value = str(raw_value).strip()
              if value[:1] in ('"', "'"):
                  quote = value[0]
                  closing = None
                  escaped = False
                  for index in range(1, len(value)):
                      char = value[index]
                      if escaped:
                          escaped = False
                          continue
                      if char == "\\":
                          escaped = True
                          continue
                      if char == quote:
                          closing = index
                          break
                  if closing is None:
                      raise ValueError("Unterminated quoted config value.")
                  trailing = value[closing + 1:].strip()
                  if trailing and not trailing.startswith("#"):
                      raise ValueError(
                          f"Unexpected text after quoted config value: {trailing!r}. "
                          "Only a trailing # comment is allowed."
                      )
                  return value[1:closing]
              comment_match = re.search(r"\s#", value)
              if comment_match:
                  value = value[:comment_match.start()]
              return value.strip()
          
          
          def parse_bool_value(raw_value, default=False):
              value = str(raw_value).strip().lower()
              if value == "":
                  return default
              if value in {"true", "yes", "on", "1"}:
                  return True
              if value in {"false", "no", "off", "0"}:
                  return False
              raise ValueError(f"Invalid boolean config value: {raw_value!r}. Use true or false.")
          
          
          def parse_color_value(raw_value, default=None):
              value = strip_config_value(str(raw_value))
              if not value:
                  return default
              compact = value.strip().lower()
              if compact.startswith("#"):
                  compact = compact[1:]
              if compact.startswith("0x"):
                  compact = compact[2:]
              try:
                  if re.fullmatch(r"[0-9a-f]{6}", compact):
                      number = int(compact, 16)
                  elif re.fullmatch(r"\d+", compact):
                      number = int(compact, 10)
                  else:
                      raise ValueError
              except ValueError:
                  raise ValueError(
                      f"Invalid accent color {value!r}. Use 0xRRGGBB, RRGGBB, or a decimal RGB value."
                  )
              if not 0 <= number <= 0xFFFFFF:
                  raise ValueError(f"Accent color {value!r} is outside the RGB range 0x000000-0xFFFFFF.")
              return number
          
          
          def normalize_api_base_url(raw_value):
              value = strip_config_value(str(raw_value)) or "https://api.github.com"
              value = value.rstrip("/")
              parsed = urlparse(value)
              if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                  raise ValueError(
                      f"Invalid github_api_base_url {value!r}. Use a full URL such as https://api.github.com "
                      "or https://github.example.com/api/v3."
                  )
              if parsed.query or parsed.fragment:
                  raise ValueError("github_api_base_url must not contain a query string or fragment.")
              return urlunparse((parsed.scheme, parsed.netloc, parsed.path.rstrip("/"), "", "", ""))
          
          
          def derive_web_base_url(api_base_url):
              parsed = urlparse(api_base_url.rstrip("/"))
              host = parsed.netloc
              path = parsed.path.rstrip("/")
              if host.lower() == "api.github.com" and path == "":
                  host = "github.com"
              elif path.lower().endswith("/api/v3"):
                  path = path[:-7].rstrip("/")
              elif host.lower().startswith("api.") and path == "":
                  host = host[4:]
              return urlunparse((parsed.scheme, host, path, "", "", "")).rstrip("/")
          
          
          def parse_list_value(raw_lines_or_value):
              if isinstance(raw_lines_or_value, list):
                  return [str(value).strip() for value in raw_lines_or_value if str(value).strip()]
              value = str(raw_lines_or_value).strip()
              if not value:
                  return []
              if value.startswith("[") or value.endswith("]"):
                  if not (value.startswith("[") and value.endswith("]")):
                      raise ValueError(f"Invalid inline list value: {value!r}.")
                  value = value[1:-1].strip()
                  if not value:
                      return []
              return [part.strip().strip('"').strip("'") for part in value.split(",") if part.strip()]
          
          
          def make_container(children, accent_color=None):
              container = {"type": 17, "components": children}
              if accent_color is not None:
                  container["accent_color"] = accent_color
              return container
          
          
          def normalize_webhook_url(raw_value, field_label="webhook"):
              value = strip_config_value(str(raw_value))
              if not value:
                  return ""
              parsed = urlparse(value)
              if parsed.scheme != "https" or not parsed.netloc:
                  raise ValueError(
                      f"Invalid {field_label} URL {value!r}. Use the complete HTTPS Discord webhook URL."
                  )
              if parsed.fragment:
                  raise ValueError(f"Invalid {field_label} URL {value!r}: URL fragments are not supported.")
              return value.rstrip("/")
          
          def load_config(path):
              """Load shared defaults and the repository section from config/repos.yml."""
              if not path.is_file():
                  raise FileNotFoundError(
                      f"Config file not found: {path}. Create config/repos.yml with optional global webhook, ping settings, and repos."
                  )
          
              text = path.read_text(encoding="utf-8")
              allowed_top_level_keys = {
                  "ping_mode",
                  "ping_id",
                  "webhook",
                  "github_api_base_url",
                  "commit_accent_color",
                  "release_accent_color",
                  "stats_enabled",
                  "stats_webhook",
                  "incident_webhook",
                  "incident_ping_mode",
                  "incident_ping_id",
                  "repos",
              }
              deprecated_top_level_keys = {
                  "inactivity_accent_color",
              }
              top_level = {}
              seen_top_level_keys = set()
              repo_lines = []
              in_repos = False
              repos_indent = None
          
              for line_number, raw_line in enumerate(text.splitlines(), start=1):
                  if not raw_line.strip() or raw_line.lstrip().startswith("#"):
                      if in_repos:
                          repo_lines.append(raw_line)
                      continue
          
                  indent = len(raw_line) - len(raw_line.lstrip())
                  stripped = raw_line.strip()
          
                  if indent == 0:
                      in_repos = False
                      repos_indent = None
                      if ":" not in stripped:
                          raise ValueError(
                              f"Invalid config on line {line_number}: {stripped!r}. Expected 'key: value'."
                          )
                      key, value = stripped.split(":", 1)
                      key = key.strip()
                      value = strip_config_value(value)
                      if key in deprecated_top_level_keys:
                          print(
                              f"Ignoring deprecated config setting on line {line_number}: {key!r} "
                              "(no longer used; safe to remove from config/repos.yml)."
                          )
                          seen_top_level_keys.add(key)
                          continue
                      if key not in allowed_top_level_keys:
                          raise ValueError(
                              f"Unknown config setting on line {line_number}: {key!r}. "
                              f"Use: {', '.join(sorted(allowed_top_level_keys))}."
                          )
                      if key in seen_top_level_keys:
                          raise ValueError(
                              f"Duplicate top-level config setting on line {line_number}: {key!r}."
                          )
                      seen_top_level_keys.add(key)
                      if key == "repos":
                          if value:
                              raise ValueError(
                                  f"Invalid 'repos' setting on line {line_number}: the value must contain the repository blocks below it."
                              )
                          in_repos = True
                          top_level[key] = True
                      else:
                          top_level[key] = value
                      continue
          
                  if not in_repos:
                      raise ValueError(
                          f"Invalid config on line {line_number}: indented settings must be inside the 'repos:' section."
                      )
          
                  if repos_indent is None:
                      repos_indent = indent
                  if indent < repos_indent:
                      raise ValueError(
                          f"Invalid config indentation on line {line_number}: repository settings must stay inside 'repos:'."
                      )
                  repo_lines.append(raw_line[repos_indent:])
          
              if not top_level.get("repos"):
                  raise ValueError("Config is missing the 'repos:' section.")
          
              defaults = {
                  "ping_mode": str(top_level.get("ping_mode", "user")).strip().lower(),
                  "ping_id": str(top_level.get("ping_id", "")).strip(),
                  "webhook": normalize_webhook_url(top_level.get("webhook", ""), "global webhook"),
                  "github_api_base_url": normalize_api_base_url(
                      top_level.get("github_api_base_url", "https://api.github.com")
                  ),
                  "commit_accent_color": parse_color_value(
                      top_level.get("commit_accent_color", "5865F2"), 0x5865F2
                  ),
                  "release_accent_color": parse_color_value(
                      top_level.get("release_accent_color", "FEE75C"), 0xFEE75C
                  ),
              }
              defaults["stats_enabled"] = parse_bool_value(top_level.get("stats_enabled", "false"), False)
              defaults["stats_webhook"] = normalize_webhook_url(top_level.get("stats_webhook", ""), "stats webhook")
              if defaults["stats_enabled"] and not defaults["stats_webhook"]:
                  raise ValueError(
                      "stats_enabled is true but stats_webhook is empty. Set stats_webhook in config/repos.yml or disable the stats dashboard."
                  )
              defaults["incident_webhook"] = normalize_webhook_url(
                  top_level.get("incident_webhook", ""), "incident webhook"
              )
              incident_ping_mode = str(
                  top_level.get("incident_ping_mode", defaults["ping_mode"])
              ).strip().lower() or defaults["ping_mode"]
              defaults["incident_ping_mode"] = incident_ping_mode
              incident_ping_id = str(
                  top_level.get("incident_ping_id", defaults["ping_id"])
              ).strip()
              if "incident_ping_id" not in top_level:
                  incident_ping_id = defaults["ping_id"]
              defaults["incident_ping_id"] = incident_ping_id
              return defaults, "\n".join(repo_lines).strip()
          
          print(f"Loading config from {CONFIG_FILE.resolve() if CONFIG_FILE.exists() else CONFIG_FILE}")
          if not CONFIG_FILE.is_file():
              print(f"::error::Config file not found: {CONFIG_FILE}")
              raise FileNotFoundError(
                  f"Config file not found: {CONFIG_FILE}. Create config/repos.yml with optional global webhook, ping settings, and repos."
              )
          try:
              DEFAULTS, REPOS_RAW = load_config(CONFIG_FILE)
          except Exception as config_error:
              print(f"::error::Config validation failed while loading {CONFIG_FILE}: {config_error}")
              raise

          VALID_PING_MODES = {"user", "role", "everyone", "none"}
          try:
              if DEFAULTS["ping_mode"] not in VALID_PING_MODES:
                  raise ValueError(
                      f"Invalid ping_mode in config: {DEFAULTS['ping_mode']!r}. Use user, role, everyone, or none."
                  )
              if DEFAULTS["ping_mode"] in {"user", "role"} and not DEFAULTS["ping_id"]:
                  raise ValueError(
                      f"ping_mode is {DEFAULTS['ping_mode']!r} but ping_id is empty. "
                      "Set ping_id in config/repos.yml, or change ping_mode to everyone/none."
                  )
              if DEFAULTS["ping_id"] and not re.fullmatch(r"\d+", DEFAULTS["ping_id"]):
                  raise ValueError(
                      f"Invalid global ping_id {DEFAULTS['ping_id']!r}. Discord user and role IDs must contain digits only."
                  )
          except Exception as config_error:
              print(f"::error::Config validation failed: {config_error}")
              raise
          
          DEFAULT_PING_MODE = DEFAULTS["ping_mode"]
          DEFAULT_PING_ID = DEFAULTS["ping_id"]
          DEFAULT_WEBHOOK = DEFAULTS["webhook"]
          DEFAULT_API_BASE_URL = DEFAULTS["github_api_base_url"]
          DEFAULT_COMMIT_ACCENT_COLOR = DEFAULTS["commit_accent_color"]
          DEFAULT_RELEASE_ACCENT_COLOR = DEFAULTS["release_accent_color"]
          STATS_ENABLED = DEFAULTS["stats_enabled"]
          STATS_WEBHOOK = DEFAULTS["stats_webhook"]
          STATS_STATE_PATH = STATE_DIR / "_stats.json"
          STATS_LIFETIME_PATH = STATE_DIR / "_lifetime.json"
          STATS_MESSAGE_CACHE = Path(os.environ.get("STATS_MESSAGE_CACHE", str(STATE_DIR / "_stats.cache.json")))
          STATS_WEBHOOK_FINGERPRINT = hashlib.sha256(STATS_WEBHOOK.encode("utf-8")).hexdigest() if STATS_WEBHOOK else ""
          INCIDENT_WEBHOOK = DEFAULTS.get("incident_webhook") or ""
          INCIDENT_PING_MODE = DEFAULTS.get("incident_ping_mode") or DEFAULTS["ping_mode"]
          INCIDENT_PING_ID = DEFAULTS.get("incident_ping_id") or DEFAULTS["ping_id"]
          if INCIDENT_WEBHOOK:
              if INCIDENT_PING_MODE not in VALID_PING_MODES:
                  raise ValueError(
                      f"Invalid incident_ping_mode in config: {INCIDENT_PING_MODE!r}. "
                      "Use user, role, everyone, or none."
                  )
              if INCIDENT_PING_MODE in {"user", "role"} and not INCIDENT_PING_ID:
                  raise ValueError(
                      f"incident_ping_mode is {INCIDENT_PING_MODE!r} but incident_ping_id is empty. "
                      "Set incident_ping_id (or global ping_id) in config/repos.yml, or use everyone/none."
                  )
              if INCIDENT_PING_ID and not re.fullmatch(r"\d+", INCIDENT_PING_ID):
                  raise ValueError(
                      f"Invalid incident_ping_id {INCIDENT_PING_ID!r}. "
                      "Discord user and role IDs must contain digits only."
                  )
          
          
          def parse_repositories(raw):
              """Parse one small YAML-style block per repository."""
              repositories = []
              valid_ping_modes = {"user", "role", "everyone", "none"}
              valid_monitor_types = {"commits", "releases"}
              allowed_keys = {
                  "repo",
                  "type",
                  "monitor",
                  "ping",
                  "ping_id",
                  "webhook",
                  "github_api_base_url",
                  "accent_color",
                  "include_release_assets",
                  "short_summary",
                  "summary_lines",
                  "tags",
                  "enabled",
              }
              list_keys = {"tags"}
              configs = []
              current = None
              current_list_key = None
              current_seen_keys = set()
              seen_repo_names = set()
          
              for line_number, raw_line in enumerate(raw.splitlines(), start=1):
                  if not raw_line.strip() or raw_line.lstrip().startswith("#"):
                      continue
          
                  indent = len(raw_line) - len(raw_line.lstrip())
                  line = raw_line.strip()
          
                  if line.startswith("- ") and indent == 0:
                      if current is not None:
                          configs.append(current)
                      current = {}
                      current_list_key = None
                      current_seen_keys = {"repo"}
                      entry = line[2:].strip()
                      if ":" not in entry:
                          raise ValueError(
                              f"Invalid repository entry on line {line_number}: {line!r}. "
                              "Each repository must start with '- repo: OWNER/REPO'."
                          )
                      key, value = entry.split(":", 1)
                      key = key.strip()
                      value = strip_config_value(value)
                      if key != "repo":
                          raise ValueError(
                              f"Invalid repository entry on line {line_number}: "
                              "the first field in each repository block must be 'repo'."
                          )
                      current[key] = value
                      continue
          
                  if current is None:
                      raise ValueError(
                          f"Invalid repository configuration on line {line_number}: "
                          "repository settings must be inside a '- repo:' block."
                      )
          
                  if line.startswith("- ") and indent > 0:
                      if current_list_key not in list_keys or current_list_key not in current:
                          raise ValueError(
                              f"Invalid list item on line {line_number}: list items are only valid for list-valued settings."
                          )
                      current[current_list_key].append(
                          strip_config_value(line[2:]).strip('"').strip("'")
                      )
                      continue
          
                  if ":" not in line:
                      raise ValueError(
                          f"Invalid repository setting on line {line_number}: {line!r}. Expected 'key: value'."
                      )
          
                  key, value = line.split(":", 1)
                  key = key.strip()
                  value = strip_config_value(value)
                  if key not in allowed_keys:
                      raise ValueError(
                          f"Unknown repository setting on line {line_number}: {key!r}. "
                          f"Use: {', '.join(sorted(allowed_keys))}."
                      )
                  if key in current_seen_keys:
                      raise ValueError(
                          f"Duplicate repository setting on line {line_number}: {key!r}."
                      )
                  current_seen_keys.add(key)
                  if key in list_keys:
                      if key not in current:
                          current[key] = []
                      if value:
                          current[key].extend(parse_list_value(value))
                      current_list_key = key
                  else:
                      current[key] = value
                      current_list_key = None
          
              if current is not None:
                  configs.append(current)
          
              for index, config in enumerate(configs, start=1):
                  repo = config.get("repo", "").strip()
                  repo_type = config.get("type", "normal").strip().lower()
                  monitor_type = config.get("monitor", "").strip().lower() or "releases"
          
                  ping_override = config.get("ping", "").strip().lower()
                  ping_id_override = config.get("ping_id", "").strip()
                  ping_mode = ping_override or DEFAULTS["ping_mode"]
                  if ping_id_override:
                      ping_id = ping_id_override
                  elif ping_mode in {"user", "role"}:
                      ping_id = DEFAULTS["ping_id"]
                  else:
                      ping_id = ""

                  api_base = normalize_api_base_url(
                      config.get("github_api_base_url", "").strip() or DEFAULTS["github_api_base_url"]
                  )
                  webhook = config.get("webhook", "").strip() or DEFAULTS["webhook"]
          
                  accent_raw = config.get("accent_color", "").strip()
                  accent_color = parse_color_value(accent_raw) if accent_raw else None
          
                  tags = [str(tag).strip() for tag in config.get("tags", []) if str(tag).strip()]
                  include_release_assets = parse_bool_value(
                      config.get("include_release_assets", "true"), True
                  )
                  short_summary = parse_bool_value(config.get("short_summary", "false"), False)
                  enabled = parse_bool_value(config.get("enabled", "true"), True)
          
                  summary_lines_raw = config.get("summary_lines", "8").strip()
                  try:
                      summary_lines = int(summary_lines_raw)
                  except ValueError as error:
                      raise ValueError(
                          f"Invalid summary_lines in repository block {index}: {summary_lines_raw!r}. Use a positive integer."
                      ) from error
                  if summary_lines < 1:
                      raise ValueError(f"summary_lines must be at least 1 in repository block {index}.")
          
                  if not repo:
                      raise ValueError(
                          f"Repository block {index} is missing 'repo: OWNER/REPO'."
                      )
                  if repo_type not in {"normal", "forum"}:
                      raise ValueError(
                          f"Invalid type in repository block {index}: {repo_type!r}. Use 'normal' or 'forum'."
                      )
                  if monitor_type not in valid_monitor_types:
                      raise ValueError(
                          f"Invalid monitor in repository block {index}: {monitor_type!r}. "
                          "Use 'commits' or 'releases'."
                      )
                  repo_match = re.fullmatch(r"([A-Za-z0-9-]{1,39})/([A-Za-z0-9._-]{1,100})", repo)
                  if not repo_match:
                      raise ValueError(
                          f"Invalid repo in repository block {index}: {repo!r}. Expected OWNER/REPO using a valid GitHub owner and repository name."
                      )
                  repo_identity = repo.casefold()
                  if repo_identity in seen_repo_names:
                      raise ValueError(
                          f"Duplicate repository in configuration: {repo!r}. A repository may only appear once because its state is shared by repo and monitor kind."
                      )
                  seen_repo_names.add(repo_identity)
                  webhook = normalize_webhook_url(webhook, f"webhook for repository {repo}")
                  if not webhook:
                      raise ValueError(
                          f"Repository block {index} has no webhook. Set the global 'webhook' or add 'webhook:' to this repository."
                      )
                  if ping_mode not in valid_ping_modes:
                      raise ValueError(
                          f"Invalid ping mode in repository block {index}: {ping_mode!r}. "
                          "Use user, role, everyone, or none."
                      )
                  if ping_mode in {"user", "role"} and not ping_id:
                      raise ValueError(
                          f"Missing ping_id in repository block {index}: ping mode {ping_mode!r} requires a user or role ID."
                      )
                  if ping_id and not re.fullmatch(r"\d+", ping_id):
                      raise ValueError(
                          f"Invalid ping_id in repository block {index}: {ping_id!r}. Discord user and role IDs must contain digits only."
                      )
                  if len(set(tags)) != len(tags):
                      raise ValueError(
                          f"Duplicate Forum tag IDs in repository block {index}. Each tag ID may only be listed once."
                      )
                  if len(tags) > 5:
                      raise ValueError(
                          f"Too many Forum tag IDs in repository block {index} ({len(tags)}). "
                          "Discord allows at most 5 applied tags per Forum post."
                      )
                  for tag_id in tags:
                      if not re.fullmatch(r"\d+", tag_id):
                          raise ValueError(
                              f"Invalid Forum tag ID in repository block {index}: {tag_id!r}. Forum tag IDs must be numeric Discord IDs."
                          )
                  if ping_id_override and not ping_override and ping_mode not in {"user", "role"}:
                      raise ValueError(
                          f"'ping_id' was set in repository block {index} but the effective ping mode is {ping_mode!r}. "
                          "Add 'ping: user' or 'ping: role', or remove ping_id."
                      )
          
                  repositories.append(
                      {
                          "repo": repo,
                          "project_name": repo.rsplit("/", 1)[-1],
                          "repo_type": repo_type,
                          "monitor_type": monitor_type,
                          "ping_mode": ping_mode,
                          "ping_id": ping_id,
                          "webhook": webhook,
                          "github_api_base_url": api_base,
                          "accent_color": accent_color,
                          "include_release_assets": include_release_assets,
                          "short_summary": short_summary,
                          "summary_lines": summary_lines,
                          "tags": tags,
                          "enabled": enabled,
                      }
                  )
          
              if not repositories:
                  raise ValueError(
                      "The 'repos:' section is empty. Add at least one '- repo: OWNER/REPO' block to config/repos.yml."
                  )
          
              return repositories
          
          def state_path_for_repo(repo):
              """Return a filesystem-safe state filename unique to the monitored repo and monitor kind."""
              key = re.sub(r"[^A-Za-z0-9._-]+", "_", repo.replace("/", "__"))
              return STATE_DIR / f"{key}_{MONITOR_KIND}.txt"
          
          
          def thread_state_path_for_repo(repo):
              """Return a filesystem-safe Forum-thread resume-state filename unique to the monitored repo and monitor kind."""
              key = re.sub(r"[^A-Za-z0-9._-]+", "_", repo.replace("/", "__"))
              return STATE_DIR / f"{key}_{MONITOR_KIND}_thread.json"
          
          
          def delivery_state_path_for_repo(repo, kind=None):
              """Return normal-channel multi-part delivery resume state for the monitored repo and kind."""
              key = re.sub(r"[^A-Za-z0-9._-]+", "_", repo.replace("/", "__"))
              resolved_kind = kind or MONITOR_KIND
              return STATE_DIR / f"{key}_{resolved_kind}_delivery.json"
          
          
          def failure_state_path_for_repo(repo, kind):
              """Return durable transient failure-alert state for one repository/monitor kind."""
              key = re.sub(r"[^A-Za-z0-9._-]+", "_", repo.replace("/", "__"))
              return STATE_DIR / f"{key}_{kind}_failure.json"
          
          
          def permanent_failure_state_path_for_repo(repo):
              """Return durable one-time permanent-failure state shared by all monitor kinds for a repository."""
              key = re.sub(r"[^A-Za-z0-9._-]+", "_", repo.replace("/", "__"))
              return STATE_DIR / f"{key}_permanent_failure.json"
          
          
          def release_notify_state_path_for_repo(repo):
              """Return durable state for the repo's *current latest* release notification only.

              Only the newest release is tracked for edited-release detection. When a newer
              tag is published, this file is overwritten and prior message IDs are discarded.
              """
              key = re.sub(r"[^A-Za-z0-9._-]+", "_", repo.replace("/", "__"))
              return STATE_DIR / f"{key}_release_notify.json"


          def etag_state_path_for_repo(repo, kind):
              """Return durable HTTP validator state (ETag / Last-Modified) for one repo+kind."""
              key = re.sub(r"[^A-Za-z0-9._-]+", "_", repo.replace("/", "__"))
              return STATE_DIR / f"{key}_{kind}_etag.json"


          def load_etag_state(repo, kind):
              data = _load_json_state(etag_state_path_for_repo(repo, kind))
              etag = str(data.get("etag") or "").strip() or None
              last_modified = str(data.get("last_modified") or "").strip() or None
              return etag, last_modified


          def save_etag_state(repo, kind, etag=None, last_modified=None):
              path = etag_state_path_for_repo(repo, kind)
              etag = str(etag or "").strip()
              last_modified = str(last_modified or "").strip()
              if not etag and not last_modified:
                  _clear_json_state(path)
                  return
              _save_json_state(
                  path,
                  {
                      "etag": etag,
                      "last_modified": last_modified,
                  },
              )
          
          
          GLOBAL_RATE_LIMIT_STATE = STATE_DIR / "_github_primary_rate_limit_failure.json"
          
          
          def _load_json_state(path):
              if not path.exists():
                  return {}
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  return data if isinstance(data, dict) else {}
              except (OSError, json.JSONDecodeError) as error:
                  print(f"Could not read failure state {path}: {error}")
                  return {}
          
          
          def _save_json_state(path, data):
              path.parent.mkdir(parents=True, exist_ok=True)
              temp_path = path.with_name(path.name + ".tmp")
              temp_path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
              temp_path.replace(path)
          
          
          def _clear_json_state(path):
              try:
                  path.unlink()
              except FileNotFoundError:
                  pass
          
          
          def _safe_failed_kinds(state):
              raw = state.get("failed_kinds", [])
              if not isinstance(raw, (list, tuple, set)):
                  return set()
              return {str(kind) for kind in raw if str(kind) in {"commits", "releases"}}
          
          
          def _safe_alert_sent(state):
              return state.get("alert_sent") is True
          
          
          def _safe_consecutive(state):
              try:
                  value = int(state.get("consecutive", 0))
              except (TypeError, ValueError):
                  return 0
              return max(value, 0)
          
          
          def _now_epoch():
              return int(time.time())


          def _iso_to_epoch(value):
              if not value:
                  return None
              try:
                  from datetime import datetime, timezone
                  parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  return int(parsed.timestamp())
              except (TypeError, ValueError, OverflowError):
                  return None


          def _next_scheduled_check_epoch(now=None):
              """Return when the next monitor run is expected.

              Uses a fixed interval from *now* (default 5 minutes) rather than the
              next wall-clock :00/:05 boundary. Clock alignment made "Next Check"
              show 1–4 minutes right after a run, or "X minutes ago" when the
              external cron (cron-job.org) is not aligned to those boundaries.
              """
              current = int(now if now is not None else _now_epoch())
              return current + SCHEDULE_INTERVAL_SECONDS


          def _stats_default_state():
              now = _now_epoch()
              return {
                  "version": 2,
                  "message_id": "",
                  "created_at": now,
                  "updated_at": now,
                  "message_created_at": None,
                  "message_updated_at": None,
                  "lifetime": {
                      "runs": 0,
                      "commits_detected": 0,
                      "releases_detected": 0,
                      "discord_notifications": 0,
                      "forum_posts": 0,
                      "errors": 0,
                  },
                  "repositories": {},
                  "current": {
                      "last_run": now,
                      "last_check": now,
                      "next_check": _next_scheduled_check_epoch(now),
                      "repos_total": 0,
                      "repos_checked": 0,
                      "new_commits": 0,
                      "new_releases": 0,
                      "notifications": 0,
                      "forum_posts": 0,
                      "errors": 0,
                      "rate_limited": False,
                      "last_successful_check": None,
                      "last_rate_limit": None,
                      "last_error": None,
                  },
                  "last_known": {
                      "last_successful_check": None,
                      "last_rate_limit": None,
                      "last_rate_limit_reset": None,
                      "last_error": None,
                      "github_rate_limit_remaining": None,
                      "github_rate_limit_limit": None,
                      "github_rate_limit_reset": None,
                      "github_rate_limit_observed_at": None,
                  },
                  "webhook_fingerprint": STATS_WEBHOOK_FINGERPRINT,
              }


          def _load_stats_message_cache():
              """Load the Actions-cache backup of stats message_id and lifetime counters."""
              if not STATS_MESSAGE_CACHE.exists():
                  return {}
              try:
                  data = json.loads(STATS_MESSAGE_CACHE.read_text(encoding="utf-8"))
                  return data if isinstance(data, dict) else {}
              except (OSError, json.JSONDecodeError) as error:
                  print(f"Could not read stats message cache {STATS_MESSAGE_CACHE}: {error}")
                  return {}


          def _coerce_nonneg_int(value, default=0):
              try:
                  number = int(value)
              except (TypeError, ValueError):
                  return int(default)
              return number if number >= 0 else int(default)


          def _read_lifetime_totals_file():
              data = _load_json_state(STATS_LIFETIME_PATH)
              return {key: _coerce_nonneg_int(data.get(key)) for key in LIFETIME_COUNTER_KEYS}


          def _monotonic_lifetime_totals(*sources):
              """Return the per-key maximum across any number of lifetime dicts."""
              totals = {key: 0 for key in LIFETIME_COUNTER_KEYS}
              for source in sources:
                  if not isinstance(source, dict):
                      continue
                  for key in LIFETIME_COUNTER_KEYS:
                      totals[key] = max(totals[key], _coerce_nonneg_int(source.get(key)))
              return totals


          def _write_lifetime_totals_file(totals):
              payload = {key: _coerce_nonneg_int(totals.get(key)) for key in LIFETIME_COUNTER_KEYS}
              # Never decrease values already on disk.
              merged = _monotonic_lifetime_totals(_read_lifetime_totals_file(), payload)
              _save_json_state(STATS_LIFETIME_PATH, merged)
              return merged


          def _apply_monotonic_lifetime(state):
              """Raise state lifetime counters to the max of state, git file, and cache."""
              if state is None:
                  return
              lifetime = state.setdefault("lifetime", {})
              cached = _load_stats_message_cache()
              cached_fp = str(cached.get("webhook_fingerprint") or "").strip()
              cache_lifetime = (
                  cached.get("lifetime")
                  if (not cached_fp or cached_fp == STATS_WEBHOOK_FINGERPRINT)
                  else {}
              )
              merged = _monotonic_lifetime_totals(
                  lifetime,
                  _read_lifetime_totals_file(),
                  cache_lifetime if isinstance(cache_lifetime, dict) else {},
              )
              raised = []
              for key in LIFETIME_COUNTER_KEYS:
                  before = _coerce_nonneg_int(lifetime.get(key))
                  lifetime[key] = merged[key]
                  if merged[key] > before:
                      raised.append(f"{key} {before}->{merged[key]}")
              if raised:
                  print(
                      "Restored higher lifetime counters from durable backups "
                      f"(git/cache): {', '.join(raised)}."
                  )
              _write_lifetime_totals_file(merged)


          def _save_stats_message_cache(state):
              """Persist message_id and lifetime counters outside git.

              Lifetime writes are monotonic: an older/stale in-memory state cannot
              overwrite a higher Errors (or other) total already stored in the cache.
              """
              if state is None:
                  return
              message_id = str(state.get("message_id") or "").strip()
              existing = _load_stats_message_cache()
              lifetime = _monotonic_lifetime_totals(
                  state.get("lifetime") or {},
                  existing.get("lifetime") if isinstance(existing.get("lifetime"), dict) else {},
                  _read_lifetime_totals_file(),
              )
              payload = {
                  "message_id": message_id or str(existing.get("message_id") or "").strip(),
                  "webhook_fingerprint": STATS_WEBHOOK_FINGERPRINT,
                  "message_updated_at": state.get("message_updated_at") or existing.get("message_updated_at"),
                  "message_created_at": state.get("message_created_at") or existing.get("message_created_at"),
                  "lifetime": lifetime,
              }
              if not payload["message_id"] and existing.get("message_id"):
                  payload["message_id"] = str(existing.get("message_id") or "").strip()
              try:
                  STATS_MESSAGE_CACHE.parent.mkdir(parents=True, exist_ok=True)
                  temp_path = STATS_MESSAGE_CACHE.with_name(STATS_MESSAGE_CACHE.name + ".tmp")
                  temp_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
                  temp_path.replace(STATS_MESSAGE_CACHE)
              except OSError as error:
                  print(f"Could not write stats message cache: {error}")


          def load_stats_state():
              if not STATS_ENABLED:
                  return None
              state = _load_json_state(STATS_STATE_PATH)
              if not state:
                  state = _stats_default_state()
              if state.get("webhook_fingerprint") != STATS_WEBHOOK_FINGERPRINT:
                  state["message_id"] = ""
                  state["message_created_at"] = None
                  state["message_updated_at"] = None
                  state["webhook_fingerprint"] = STATS_WEBHOOK_FINGERPRINT
              state["version"] = max(int(state.get("version", 1) or 1), 2)
              state.setdefault("created_at", _now_epoch())
              state.setdefault("message_id", "")
              state.setdefault("updated_at", _now_epoch())
              state.setdefault("message_created_at", None)
              state.setdefault("message_updated_at", None)
              state.setdefault("lifetime", {})
              state.setdefault("repositories", {})
              state.setdefault("current", {})
              state.setdefault("last_known", {})
              defaults = _stats_default_state()
              for key, default in defaults["lifetime"].items():
                  state["lifetime"].setdefault(key, default)
              for key, default in defaults["current"].items():
                  state["current"].setdefault(key, default)
              for key, default in defaults["last_known"].items():
                  state["last_known"].setdefault(key, default)
              state["current"].setdefault("last_check", state["current"].get("last_run") or _now_epoch())
              state["current"].setdefault("next_check", _next_scheduled_check_epoch(state["current"].get("last_check")))
              state["current"].setdefault("repos_total", 0)

              for key in LIFETIME_COUNTER_KEYS:
                  state["lifetime"][key] = _coerce_nonneg_int(
                      state["lifetime"].get(key), defaults["lifetime"].get(key, 0)
                  )

              cached = _load_stats_message_cache()
              cached_fp = str(cached.get("webhook_fingerprint") or "").strip()
              cache_ok = not cached_fp or cached_fp == STATS_WEBHOOK_FINGERPRINT

              if not str(state.get("message_id") or "").strip() and cache_ok:
                  cached_id = str(cached.get("message_id") or "").strip()
                  if cached_id:
                      state["message_id"] = cached_id
                      if cached.get("message_created_at") and not state.get("message_created_at"):
                          state["message_created_at"] = cached.get("message_created_at")
                      if cached.get("message_updated_at") and not state.get("message_updated_at"):
                          state["message_updated_at"] = cached.get("message_updated_at")
                      print(
                          f"Restored stats message_id {cached_id} from Actions cache backup "
                          "(git state had no message_id — usually a previous push race)."
                      )

              # Monotonic merge across _stats.json, _lifetime.json, Actions cache, and
              # last_known high-water mark. Prevents Lifetime Errors from rolling backward.
              _apply_monotonic_lifetime(state)
              last_known = state.setdefault("last_known", {})
              high_water = max(
                  _coerce_nonneg_int(last_known.get("lifetime_errors_high_water")),
                  _coerce_nonneg_int(state["lifetime"].get("errors")),
              )
              last_known["lifetime_errors_high_water"] = high_water
              state["lifetime"]["errors"] = high_water
              # Re-sync every durable store so a partial loss (git vs cache vs lifetime
              # file) is healed on the next read, not only on the next error.
              _write_lifetime_totals_file(state["lifetime"])
              _save_stats_message_cache(state)
              print(
                  f"Lifetime counters loaded: "
                  f"runs={state['lifetime'].get('runs', 0)}, "
                  f"errors={state['lifetime'].get('errors', 0)}, "
                  f"notifications={state['lifetime'].get('discord_notifications', 0)}."
              )

              return state


          def save_stats_state(state):
              if state is None:
                  return
              state["updated_at"] = _now_epoch()
              state["webhook_fingerprint"] = STATS_WEBHOOK_FINGERPRINT
              # Always raise in-memory totals to the durable high-water marks first so a
              # stale state object can never write Errors (or other totals) backward.
              _apply_monotonic_lifetime(state)
              lifetime = state.setdefault("lifetime", {})
              last_known = state.setdefault("last_known", {})
              high_water = _coerce_nonneg_int(last_known.get("lifetime_errors_high_water"))
              errors = _coerce_nonneg_int(lifetime.get("errors"))
              if errors > high_water:
                  last_known["lifetime_errors_high_water"] = errors
              elif high_water > errors:
                  lifetime["errors"] = high_water
              _save_json_state(STATS_STATE_PATH, state)
              _save_stats_message_cache(state)
              print(
                  f"Lifetime counters saved: "
                  f"runs={lifetime.get('runs', 0)}, "
                  f"errors={lifetime.get('errors', 0)}."
              )


          def _bump_lifetime_errors(state, amount=1):
              """Increment lifetime errors and flush every durable store immediately.

              Errors are a high-water mark across _stats.json, _lifetime.json, Actions
              cache, and last_known.lifetime_errors_high_water. Nothing may lower them.
              """
              if state is None:
                  return 0
              amount = max(1, int(amount or 1))
              lifetime = state.setdefault("lifetime", {})
              last_known = state.setdefault("last_known", {})
              current = (
                  _coerce_nonneg_int(lifetime.get("errors"))
                  + amount
              )
              durable = _monotonic_lifetime_totals(
                  lifetime,
                  _read_lifetime_totals_file(),
                  (_load_stats_message_cache().get("lifetime") or {}),
                  {"errors": last_known.get("lifetime_errors_high_water")},
              )
              new_total = max(current, durable.get("errors", 0))
              lifetime["errors"] = new_total
              last_known["lifetime_errors_high_water"] = new_total
              _write_lifetime_totals_file(lifetime)
              # Full stats save so git snapshot + cache cannot miss this increment.
              save_stats_state(state)
              return new_total


          def _stats_repo_state(state, repo):
              repos = state["repositories"]
              entry = repos.setdefault(repo, {
                  "commits_detected": 0,
                  "releases_detected": 0,
                  "notifications": 0,
                  "forum_posts": 0,
                  "last_seen_commit": None,
                  "last_detected_commit": None,
                  "last_seen_release": None,
                  "last_detected_release": None,
                  "last_successful_check": None,
                  "last_status": "Unknown",
                  "last_error": None,
                  "last_rate_limit": None,
                  "monitor_kinds": [],
              })
              entry.setdefault("last_seen_commit", None)
              entry.setdefault("last_detected_commit", None)
              entry.setdefault("last_seen_release", None)
              entry.setdefault("last_detected_release", None)
              entry.setdefault("last_successful_check", None)
              entry.setdefault("last_status", "Unknown")
              entry.setdefault("last_error", None)
              entry.setdefault("last_rate_limit", None)
              entry.setdefault("monitor_kinds", [])
              return entry


          def _stats_set_monitor_kinds(repo_state, monitor_type):
              """Record whether this repo is monitored for commits or releases."""
              kinds = set(repo_state.get("monitor_kinds") or [])
              normalized = str(monitor_type or "").strip().lower()
              if normalized == "commits":
                  kinds.add("commits")
              if normalized == "releases":
                  kinds.add("releases")
              repo_state["monitor_kinds"] = sorted(kinds)


          def _stats_prune_removed_repos(state, config_repos):
              """Drop stats entries for repos no longer present in config/repos.yml."""
              if state is None:
                  return
              repos = state.get("repositories")
              if not isinstance(repos, dict) or not repos:
                  return
              keep = {str(repo).strip() for repo in (config_repos or []) if str(repo).strip()}
              removed = [repo for repo in list(repos.keys()) if repo not in keep]
              for repo in removed:
                  repos.pop(repo, None)
              if removed:
                  print(
                      f"Removed {len(removed)} repo(s) from the stats dashboard "
                      f"(no longer in config): {', '.join(sorted(removed, key=str.casefold))}."
                  )


          def _resolve_next_check_epoch(previous_next=None, last_check=None, now=None):
              """Keep an upcoming next_check target; only reschedule when it is missing or past."""
              current = int(now if now is not None else _now_epoch())
              try:
                  prev = int(previous_next) if previous_next is not None else None
              except (TypeError, ValueError):
                  prev = None
              if prev is not None and prev > current:
                  return prev
              base = last_check if last_check is not None else current
              try:
                  base = int(base)
              except (TypeError, ValueError):
                  base = current
              return _next_scheduled_check_epoch(base if base > 0 else current)


          def _record_stats_run_start(state, repo_count=0, reset_schedule=True):
              """Start a new current-run window.

              reset_schedule=True (normal monitor cycles): last_check=now, next_check=now+interval.
              reset_schedule=False (error/fatal updates): keep the existing countdown when it is
              still in the future so an error-driven stats edit does not push Next check out.
              """
              if state is None:
                  return
              now = _now_epoch()
              previous = state.get("current") or {}
              previous_next = previous.get("next_check")
              previous_last_check = previous.get("last_check")
              state["lifetime"]["runs"] = _coerce_nonneg_int(state["lifetime"].get("runs")) + 1
              if reset_schedule:
                  last_check = now
                  next_check = _next_scheduled_check_epoch(now)
              else:
                  last_check = previous_last_check if previous_last_check is not None else now
                  next_check = _resolve_next_check_epoch(
                      previous_next, last_check=last_check, now=now
                  )
              state["current"] = {
                  "last_run": now,
                  "last_check": last_check,
                  "next_check": next_check,
                  "repos_total": int(repo_count or 0),
                  "repos_checked": 0,
                  "new_commits": 0,
                  "new_releases": 0,
                  "notifications": 0,
                  "forum_posts": 0,
                  "errors": 0,
                  "rate_limited": False,
                  "last_successful_check": state.get("last_known", {}).get("last_successful_check"),
                  "last_rate_limit": state.get("last_known", {}).get("last_rate_limit"),
                  "last_error": None,
                  "_failed_repo_names": [],
              }


          def _record_stats_repo_checked(state, repo):
              if state is None:
                  return
              checked_repos = state["current"].setdefault("_checked_repo_names", [])
              if repo not in checked_repos:
                  checked_repos.append(repo)
                  state["current"]["repos_checked"] += 1


          def _record_stats_repo_result(state, config, result):
              if state is None:
                  return
              repo_state = _stats_repo_state(state, config["repo"])
              _stats_set_monitor_kinds(repo_state, config.get("monitor_type"))
              now = _now_epoch()
              failed_repos = state["current"].setdefault("_failed_repo_names", [])
              if config["repo"] not in failed_repos:
                  repo_state["last_status"] = "Operational"
                  repo_state["last_error"] = None
              repo_state["last_successful_check"] = now
              _record_stats_repo_checked(state, config["repo"])
              state["last_known"]["last_successful_check"] = now
              state["current"]["last_successful_check"] = now

              if not result:
                  return

              new_commits = int(result.get("new_commits", 0))
              new_releases = int(result.get("new_releases", 0))
              notifications = int(result.get("notifications", 0))
              forum_posts = int(result.get("forum_posts", 0))

              state["current"]["new_commits"] += new_commits
              state["current"]["new_releases"] += new_releases
              state["current"]["notifications"] += notifications
              state["current"]["forum_posts"] += forum_posts
              state["lifetime"]["commits_detected"] += new_commits
              state["lifetime"]["releases_detected"] += new_releases
              state["lifetime"]["discord_notifications"] += notifications
              state["lifetime"]["forum_posts"] += forum_posts

              repo_state["commits_detected"] += new_commits
              repo_state["releases_detected"] += new_releases
              repo_state["notifications"] += notifications
              repo_state["forum_posts"] += forum_posts
              if result.get("last_seen_commit"):
                  repo_state["last_seen_commit"] = result["last_seen_commit"]
              if result.get("last_detected_commit"):
                  repo_state["last_detected_commit"] = result["last_detected_commit"]
              if result.get("last_seen_release"):
                  repo_state["last_seen_release"] = result["last_seen_release"]
              if result.get("last_detected_release"):
                  repo_state["last_detected_release"] = result["last_detected_release"]


          def _record_stats_error(state, config, error):
              if state is None:
                  return
              _record_stats_repo_checked(state, config["repo"])
              failed_repos = state["current"].setdefault("_failed_repo_names", [])
              if config["repo"] not in failed_repos:
                  failed_repos.append(config["repo"])
              repo_state = _stats_repo_state(state, config["repo"])
              _stats_set_monitor_kinds(repo_state, config.get("monitor_type"))
              now = _now_epoch()
              repo_state["last_status"] = "Error"
              repo_state["last_error"] = str(error)
              state["current"]["errors"] = _coerce_nonneg_int(state["current"].get("errors")) + 1
              _bump_lifetime_errors(state, 1)
              error_info = {
                  "repo": config["repo"],
                  "kind": config.get("monitor_type"),
                  "message": str(error),
                  "timestamp": now,
              }
              state["current"]["last_error"] = error_info
              state["last_known"]["last_error"] = error_info
              # Re-save so last_error is included after the lifetime flush.
              save_stats_state(state)
              send_incident_log(
                  "error",
                  str(error),
                  repo=config["repo"],
                  details={
                      "Monitor": config.get("monitor_type"),
                      "Status": getattr(error, "status", None),
                  },
              )


          def _record_stats_rate_limit(state, config, reset_epoch):
              if state is None:
                  return
              _record_stats_repo_checked(state, config["repo"])
              now = _now_epoch()
              repo_state = _stats_repo_state(state, config["repo"])
              _stats_set_monitor_kinds(repo_state, config.get("monitor_type"))
              repo_state["last_status"] = "Rate Limited!"
              repo_state["last_rate_limit"] = now
              state["current"]["rate_limited"] = True
              state["current"]["last_rate_limit"] = now
              state["last_known"]["last_rate_limit"] = now
              state["last_known"]["last_rate_limit_reset"] = reset_epoch
              reset_text = (
                  _discord_timestamp(reset_epoch, "f") if reset_epoch else "unknown"
              )
              send_incident_log(
                  "rate_limit",
                  "GitHub primary API rate limit exhausted while monitoring this repository. "
                  "Remaining repos in this run may be skipped.",
                  repo=config["repo"],
                  details={
                      "Monitor": config.get("monitor_type"),
                      "Resets": reset_text,
                  },
              )


          def _discord_timestamp(epoch, style="t"):
              try:
                  if epoch is None:
                      return "Unknown"
                  return f"<t:{int(epoch)}:{style}>"
              except (TypeError, ValueError, OverflowError):
                  return "Unknown"


          def _stats_commit_version(commit_info):
              """Version string from a stored commit stats payload, if any."""
              if not isinstance(commit_info, dict):
                  return ""
              version = str(commit_info.get("version") or "").strip()
              if version and version.lower() != "unknown":
                  return version
              message = str(commit_info.get("message") or "")
              if message:
                  extracted = extract_update_version(message)
                  if extracted and extracted.lower() != "unknown":
                      return extracted
              return ""


          def _stats_markdown_link(label, url):
              """Return a Discord markdown link, or plain label when url is missing."""
              text = str(label or "").strip() or "Unknown"
              href = str(url or "").strip()
              if not href:
                  return text
              safe_label = text.replace("[", "(").replace("]", ")")
              return f"[{safe_label}]({href})"


          def _stats_last_commit_text(repo_state, repo_full_name=""):
              """Human-readable last-commit line with an optional masked GitHub link."""
              commit = repo_state.get("last_detected_commit") or repo_state.get("last_seen_commit")
              if not isinstance(commit, dict):
                  return "None yet"
              version = _stats_commit_version(commit)
              sha = str(commit.get("sha") or "").strip()
              short_sha = sha[:7] if sha else ""
              message = str(commit.get("message") or "").strip()
              if version:
                  label = version
              elif short_sha:
                  label = short_sha
              elif message:
                  label = message[:48] + ("…" if len(message) > 48 else "")
              else:
                  label = "Unknown"
              url = str(commit.get("url") or "").strip()
              if not url and sha and repo_full_name:
                  url = f"https://github.com/{repo_full_name}/commit/{sha}"
              linked = _stats_markdown_link(label, url)
              committed = commit.get("committed_at_epoch")
              if committed:
                  return f"{linked} · {_discord_timestamp(committed, 'f')}"
              return linked


          def _stats_last_release_text(repo_state, repo_full_name=""):
              """Human-readable last-release line with an optional masked GitHub link.

              Never falls back to commit versions so commit-only repos can show Last Commit instead.
              """
              release = repo_state.get("last_detected_release") or repo_state.get("last_seen_release")
              if not isinstance(release, dict):
                  return "None yet"
              tag = str(release.get("tag") or "Unknown")
              url = str(release.get("url") or "").strip()
              if not url and tag and tag != "Unknown" and repo_full_name:
                  url = f"https://github.com/{repo_full_name}/releases/tag/{tag}"
              linked = _stats_markdown_link(tag, url)
              published = release.get("published_at_epoch") or release.get("created_at_epoch")
              if published:
                  return f"{linked} · {_discord_timestamp(published, 'f')}"
              return linked


          def _stats_repo_status_text(repo_state):
              status = str(repo_state.get("last_status") or "Unknown")
              if status == "Disabled":
                  return ":red_circle: Disabled"
              if status == "Rate Limited!":
                  return ":yellow_circle: Rate Limited!"
              if status == "Error":
                  return ":orange_circle: Error"
              if status == "Operational":
                  return ":green_circle: Operational"
              return ":white_circle: Unknown"


          def _stats_repo_status_emoji(repo_state):
              """Compact status indicator for repository field names."""
              status = str(repo_state.get("last_status") or "Unknown")
              if status == "Disabled":
                  return ":red_circle:"
              if status == "Rate Limited!":
                  return ":yellow_circle:"
              if status == "Error":
                  return ":orange_circle:"
              if status == "Operational":
                  return ":green_circle:"
              return ":white_circle:"


          def _stats_infer_monitor_kinds(repo_state):
              """Return the set of monitor kinds for a repo, inferring from history when needed."""
              monitor_kinds = set(repo_state.get("monitor_kinds") or [])
              if monitor_kinds:
                  return monitor_kinds
              commits_n = int(repo_state.get("commits_detected", 0) or 0)
              releases_n = int(repo_state.get("releases_detected", 0) or 0)
              if (
                  commits_n
                  or repo_state.get("last_detected_commit")
                  or repo_state.get("last_seen_commit")
              ):
                  monitor_kinds.add("commits")
              if (
                  releases_n
                  or repo_state.get("last_detected_release")
                  or repo_state.get("last_seen_release")
              ):
                  monitor_kinds.add("releases")
              return monitor_kinds


          def _stats_repo_display_labels(repo_keys):
              """Map full owner/repo → display label (short name, or full on collision)."""
              short_counts = {}
              for repo in repo_keys:
                  short = str(repo).rsplit("/", 1)[-1]
                  key = short.casefold()
                  short_counts[key] = short_counts.get(key, 0) + 1
              labels = {}
              for repo in repo_keys:
                  short = str(repo).rsplit("/", 1)[-1]
                  if short_counts.get(short.casefold(), 0) > 1:
                      labels[repo] = str(repo)
                  else:
                      labels[repo] = short
              return labels


          def _fit_stats_text(text, limit=4096):
              """Trim text to a Discord embed description/field budget."""
              if len(text) <= limit:
                  return text
              suffix = "\n\n_Stats panel shortened to fit Discord's limit._"
              return text[: max(0, limit - len(suffix))] + suffix


          def _stats_embed(description=None, fields=None, color=None):
              embed = {"color": int(color if color is not None else DEFAULT_COMMIT_ACCENT_COLOR)}
              if description is not None:
                  embed["description"] = _fit_stats_text(str(description), 4096)
              if fields:
                  embed["fields"] = fields[:25]
              return embed


          def _render_stats_embeds(state):
              """Build the Discord stats dashboard as one classic embed (no Components V2, no ping).

              Single-embed layout:
                description: Header + This Run + Lifetime + Repository Activity heading
                fields: one inline field per repo (short name unless collision)
              Incidents are posted as separate messages to incident_webhook, not in this embed.
              """
              current = state["current"]
              lifetime = state["lifetime"]
              repos = state["repositories"]
              last_known = state.get("last_known") or {}
              accent = DEFAULT_COMMIT_ACCENT_COLOR

              if current.get("rate_limited"):
                  status_line = ":yellow_circle: Rate Limited!"
                  last_reset = last_known.get("last_rate_limit_reset")
                  if last_reset:
                      status_line = f":yellow_circle: Rate Limited! · resets {_discord_timestamp(last_reset, 'T')}"
              elif current.get("errors", 0):
                  error_count = int(current.get("errors", 0) or 0)
                  status_line = (
                      f":orange_circle: {error_count} error{'s' if error_count != 1 else ''} this run"
                  )
              else:
                  status_line = ":green_circle: Operational"

              description_parts = [
                  "# Repo Monitor",
                  status_line,
                  "",
                  f"Last check · {_discord_timestamp(current.get('last_check'), 'T')}",
                  f"Next check · {_discord_timestamp(current.get('next_check'), 'R')}",
                  f"Repos checked · {current.get('repos_checked', 0)}/{current.get('repos_total', 0)}",
              ]
              rl_remaining = last_known.get("github_rate_limit_remaining")
              rl_limit = last_known.get("github_rate_limit_limit")
              rl_reset = last_known.get("github_rate_limit_reset")
              if rl_remaining is not None or rl_limit is not None:
                  try:
                      remaining_text = f"{int(rl_remaining):,}" if rl_remaining is not None else "?"
                  except (TypeError, ValueError):
                      remaining_text = str(rl_remaining)
                  try:
                      limit_text = f"{int(rl_limit):,}" if rl_limit is not None else "?"
                  except (TypeError, ValueError):
                      limit_text = str(rl_limit)
                  budget_line = f"GitHub API · {remaining_text} / {limit_text} remaining"
                  if rl_reset:
                      budget_line += f" · resets {_discord_timestamp(rl_reset, 'T')}"
                  description_parts.append(budget_line)

              run_commits = int(current.get("new_commits", 0) or 0)
              run_releases = int(current.get("new_releases", 0) or 0)
              run_notifs = int(current.get("notifications", 0) or 0)
              run_errors = int(current.get("errors", 0) or 0)
              run_forum = int(current.get("forum_posts", 0) or 0)
              this_run_parts = [
                  f"{run_commits} commit{'s' if run_commits != 1 else ''}",
                  f"{run_releases} release{'s' if run_releases != 1 else ''}",
                  f"{run_notifs} notification{'s' if run_notifs != 1 else ''}",
              ]
              if run_forum:
                  this_run_parts.append(f"{run_forum} forum post{'s' if run_forum != 1 else ''}")
              if run_errors:
                  this_run_parts.append(f"{run_errors} error{'s' if run_errors != 1 else ''}")
              description_parts.extend([
                  "",
                  "# This Run",
                  " · ".join(this_run_parts),
              ])

              description_parts.extend([
                  "",
                  "# Lifetime",
                  f"Runs: {int(lifetime.get('runs', 0) or 0):,}",
                  f"Commits detected: {int(lifetime.get('commits_detected', 0) or 0):,}",
                  f"Releases detected: {int(lifetime.get('releases_detected', 0) or 0):,}",
                  f"Notifications: {int(lifetime.get('discord_notifications', 0) or 0):,}",
              ])
              lifetime_forum = int(lifetime.get("forum_posts", 0) or 0)
              if lifetime_forum:
                  description_parts.append(f"Forum posts: {lifetime_forum:,}")
              description_parts.append(f"Errors: {int(lifetime.get('errors', 0) or 0):,}")
              created_at = state.get("created_at")
              if created_at:
                  description_parts.append(f"Tracking since: {_discord_timestamp(created_at, 'D')}")

              sorted_repos = sorted(repos.items(), key=lambda item: item[0].casefold())
              display_labels = _stats_repo_display_labels([repo for repo, _ in sorted_repos])
              max_repo_fields = 25
              description_parts.extend(["", "# Repository Activity"])
              if len(sorted_repos) > max_repo_fields:
                  description_parts.append(
                      f"_Showing {max_repo_fields} of {len(sorted_repos)} repositories._"
                  )

              repo_fields = []
              for repo, repo_state in sorted_repos[:max_repo_fields]:
                  commits_n = int(repo_state.get("commits_detected", 0) or 0)
                  releases_n = int(repo_state.get("releases_detected", 0) or 0)
                  notifs_n = int(repo_state.get("notifications", 0) or 0)
                  forum_n = int(repo_state.get("forum_posts", 0) or 0)
                  monitor_kinds = _stats_infer_monitor_kinds(repo_state)
                  status_emoji = _stats_repo_status_emoji(repo_state)
                  status_name = str(repo_state.get("last_status") or "Unknown")
                  label = display_labels.get(repo, repo.rsplit("/", 1)[-1])

                  value_lines = []
                  if "commits" in monitor_kinds:
                      value_lines.append(f"- Commits detected: {commits_n:,}")
                  if "releases" in monitor_kinds:
                      value_lines.append(f"- Releases detected: {releases_n:,}")
                  value_lines.append(f"- Notifications: {notifs_n:,}")
                  if forum_n:
                      value_lines.append(f"- Forum posts: {forum_n:,}")
                  last_check = repo_state.get("last_successful_check")
                  value_lines.append(
                      f"- Last check: {_discord_timestamp(last_check, 'T') if last_check else 'Unknown'}"
                  )
                  if "commits" in monitor_kinds:
                      value_lines.append(
                          f"- Last commit: {_stats_last_commit_text(repo_state, repo)}"
                      )
                  if "releases" in monitor_kinds:
                      value_lines.append(
                          f"- Last release: {_stats_last_release_text(repo_state, repo)}"
                      )
                  if status_name == "Error" and repo_state.get("last_error"):
                      error_text = str(repo_state.get("last_error")).replace("`", "'").replace("\n", " ")
                      if len(error_text) > 140:
                          error_text = error_text[:137] + "…"
                      value_lines.append(f"- Last error: {error_text}")

                  field_name = f"{label}  {status_emoji}"
                  if len(field_name) > 256:
                      field_name = field_name[:253] + "…"
                  repo_fields.append(
                      {
                          "name": field_name,
                          "value": _fit_stats_text("\n".join(value_lines), 1024),
                          "inline": True,
                      }
                  )

              return [
                  _stats_embed(
                      description="\n".join(description_parts),
                      fields=repo_fields,
                      color=accent,
                  )
              ]


          def _stats_webhook_url(message_id=None, wait=False):
              parsed = urlparse(STATS_WEBHOOK)
              query_params = [
                  (key, value)
                  for key, value in parse_qsl(parsed.query, keep_blank_values=True)
                  if key not in {"wait", "with_components", "thread_id"}
              ]
              if wait:
                  query_params.append(("wait", "true"))
              path = parsed.path.rstrip("/")
              if message_id:
                  path += f"/messages/{message_id}"
              return urlunparse(parsed._replace(path=path, query=urlencode(query_params)))


          def _stats_dashboard_payload(embeds):
              """Classic embed payload: no Components V2 flags, no content ping."""
              return {
                  "content": "",
                  "embeds": embeds,
                  "components": [],
                  "allowed_mentions": {},
              }


          def _post_stats_dashboard(embeds):
              body = json.dumps(_stats_dashboard_payload(embeds)).encode("utf-8")
              url = _stats_webhook_url(wait=True)

              def build_request():
                  return urllib.request.Request(
                      url,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "GitHub-Discord-Monitor/1.0",
                      },
                      method="POST",
                  )

              response_body = fetch_with_retry(build_request, service="discord")
              return json.loads(response_body) if response_body else {}


          def _edit_stats_dashboard(message_id, embeds):
              body = json.dumps(_stats_dashboard_payload(embeds)).encode("utf-8")
              url = _stats_webhook_url(message_id=message_id)

              def build_request():
                  return urllib.request.Request(
                      url,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "GitHub-Discord-Monitor/1.0",
                      },
                      method="PATCH",
                  )

              response_body = fetch_with_retry(build_request, service="discord")
              return json.loads(response_body) if response_body else {}


          def update_stats_dashboard(state):
              if not STATS_ENABLED or state is None:
                  return False
              embeds = _render_stats_embeds(state)
              message_id = str(state.get("message_id") or "").strip()
              last_check = state.get("current", {}).get("last_check")
              print(
                  f"Updating stats dashboard (message_id={message_id or 'none'}, "
                  f"last_check={last_check}, "
                  f"last_check_discord={_discord_timestamp(last_check, 't')}, "
                  f"embeds={len(embeds)})."
              )

              last_sent = _last_discord_send_at["t"]
              if last_sent is not None:
                  elapsed = time.monotonic() - last_sent
                  if elapsed < DISCORD_SEND_DELAY_SECONDS:
                      time.sleep(DISCORD_SEND_DELAY_SECONDS - elapsed)

              def _mark_updated(msg_id):
                  state["last_known"].pop("stats_dashboard_error", None)
                  state["message_id"] = str(msg_id)
                  state["message_updated_at"] = _now_epoch()
                  _last_discord_send_at["t"] = time.monotonic()

              try:
                  if message_id:
                      try:
                          response = _edit_stats_dashboard(message_id, embeds)
                          returned_id = str(response.get("id") or "").strip() if isinstance(response, dict) else ""
                          if returned_id and returned_id != message_id:
                              raise RuntimeError(
                                  f"Discord edited a different stats message ({returned_id}) than expected ({message_id})."
                              )
                          _mark_updated(message_id)
                          print(f"Updated stats dashboard message {message_id}.")
                          return True
                      except urllib.error.HTTPError as error:
                          error_body = _http_error_body(error)
                          print(
                              f"Stats dashboard edit HTTP {error.code} for message {message_id}: "
                              f"{error_body[:500]}. Creating a replacement message."
                          )
                          state["message_id"] = ""
                      except Exception as error:
                          print(
                              f"Stats dashboard edit failed for message {message_id}: {error}. "
                              "Creating a replacement message."
                          )
                          state["message_id"] = ""

                  response = _post_stats_dashboard(embeds)
                  new_message_id = str(response.get("id") or "").strip() if isinstance(response, dict) else ""
                  if not new_message_id:
                      raise RuntimeError("Discord stats dashboard creation did not return a message ID.")
                  state["message_created_at"] = _now_epoch()
                  _mark_updated(new_message_id)
                  print(
                      f"Created stats dashboard message {new_message_id}. "
                      "If an older stats message is still visible, delete it — only this ID is updated going forward."
                  )
                  return True
              except urllib.error.HTTPError as error:
                  error_body = _http_error_body(error)
                  state["last_known"]["stats_dashboard_error"] = {
                      "message": f"HTTP {error.code}: {error_body[:500]}",
                      "timestamp": _now_epoch(),
                  }
                  print(f"Stats dashboard Discord error HTTP {error.code}: {error_body[:500]}")
              except Exception as error:
                  state["last_known"]["stats_dashboard_error"] = {
                      "message": str(error),
                      "timestamp": _now_epoch(),
                  }
                  print(f"Stats dashboard update failed; monitoring will continue: {error}")
              return False


          def _sync_github_rate_limit_into_stats(state):
              """Copy the latest observed GitHub primary rate-limit budget into stats state."""
              if state is None:
                  return
              info = GITHUB_RATE_LIMIT_INFO
              if info.get("remaining") is None and info.get("limit") is None:
                  return
              last_known = state.setdefault("last_known", {})
              if info.get("remaining") is not None:
                  last_known["github_rate_limit_remaining"] = info["remaining"]
              if info.get("limit") is not None:
                  last_known["github_rate_limit_limit"] = info["limit"]
              if info.get("reset") is not None:
                  last_known["github_rate_limit_reset"] = info["reset"]
              if info.get("observed_at") is not None:
                  last_known["github_rate_limit_observed_at"] = info["observed_at"]


          def finalize_stats_dashboard(state):
              if state is None:
                  return
              state["current"].pop("_checked_repo_names", None)
              state["current"].pop("_failed_repo_names", None)
              _sync_github_rate_limit_into_stats(state)
              # Re-apply high-water marks right before render so Discord never shows a
              # lower Errors total than any durable store still holds.
              _apply_monotonic_lifetime(state)
              save_stats_state(state)
              updated = update_stats_dashboard(state)
              save_stats_state(state)
              if not updated:
                  print(
                      "::warning::Stats dashboard was not updated on Discord this run. "
                      "Check stats_webhook, that the bot/webhook can post to the channel, "
                      "and the Actions log lines above for the Discord error body."
                  )
              else:
                  print(
                      f"Stats dashboard finalize complete "
                      f"(message_id={state.get('message_id')}, "
                      f"last_check={state.get('current', {}).get('last_check')})."
                  )


          def _format_reset_time(reset_epoch):
              if not reset_epoch:
                  return "unknown"
              try:
                  return time.strftime("%Y-%m-%d %H:%M:%S UTC", time.gmtime(float(reset_epoch)))
              except (TypeError, ValueError, OverflowError):
                  return "unknown"
          
          
          def send_failure_alert(config, message, ping=True):
              """Send one durable failure heads-up using the affected repository's webhook."""
              monitor_kind = "commit" if config.get("monitor_type") in {"commit", "commits"} else "release"
              configure_repository(config, monitor_kind)
              ping_text, ping_mentions = build_ping(config["ping_mode"], config["ping_id"]) if ping else ("", {})
              components = []
              if ping_text:
                  components.append({"type": 10, "content": ping_text})
              components.append(make_container([
                  {"type": 10, "content": f"## Repo Monitor Alert: {config['project_name']}"},
                  {"type": 14, "spacing": 1},
                  {"type": 10, "content": message},
              ], DEFAULT_RELEASE_ACCENT_COLOR))
              if config["repo_type"] == "forum":
                  response = send_discord(
                      components,
                      ping_mentions,
                      thread_name=make_forum_title(f"Repo Monitor Alert - {config['project_name']}"),
                      applied_tags=config["tags"],
                  )
                  return response
              return send_discord(components, ping_mentions)


          def send_incident_log(kind, message, repo=None, details=None):
              """Post a new incident-log message to the dedicated channel (never edits).

              Each call creates a fresh Discord message so the channel acts as an error log.
              No-op when incident_webhook is unset.
              """
              if not INCIDENT_WEBHOOK:
                  return None
              kind_key = str(kind or "error").strip().lower() or "error"
              if kind_key in {"rate_limit", "rate-limited", "ratelimit"}:
                  title = "Repo Monitor · Rate Limit"
                  color = 0xFEE75C
                  emoji = ":yellow_circle:"
              elif kind_key in {"fatal", "config"}:
                  title = "Repo Monitor · Fatal Error"
                  color = 0xED4245
                  emoji = ":red_circle:"
              else:
                  title = "Repo Monitor · Error"
                  color = 0xED4245
                  emoji = ":orange_circle:"

              body_lines = [f"{emoji} **{title}**", ""]
              if repo:
                  body_lines.append(f"**Repo:** `{repo}`")
              body_lines.append(f"**When:** {_discord_timestamp(_now_epoch(), 'f')}")
              if details:
                  for key, value in details.items():
                      if value is None or value == "":
                          continue
                      body_lines.append(f"**{key}:** {value}")
              clean_message = str(message or "").strip() or "Unknown error"
              if len(clean_message) > 1500:
                  clean_message = clean_message[:1497] + "…"
              body_lines.extend(["", clean_message])

              ping_text, ping_mentions = build_ping(INCIDENT_PING_MODE, INCIDENT_PING_ID)
              embed = {
                  "color": color,
                  "description": _fit_stats_text("\n".join(body_lines), 4096),
              }
              payload = {
                  "content": ping_text or "",
                  "embeds": [embed],
                  "allowed_mentions": ping_mentions or {},
              }

              last_sent = _last_discord_send_at["t"]
              if last_sent is not None:
                  elapsed = time.monotonic() - last_sent
                  if elapsed < DISCORD_SEND_DELAY_SECONDS:
                      time.sleep(DISCORD_SEND_DELAY_SECONDS - elapsed)

              body = json.dumps(payload).encode("utf-8")
              parsed = urlparse(INCIDENT_WEBHOOK)
              query_params = [
                  (key, value)
                  for key, value in parse_qsl(parsed.query, keep_blank_values=True)
                  if key not in {"wait", "with_components", "thread_id"}
              ]
              url = urlunparse(parsed._replace(query=urlencode(query_params)))

              def build_request():
                  return urllib.request.Request(
                      url,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "GitHub-Discord-Monitor/1.0",
                      },
                      method="POST",
                  )

              try:
                  fetch_with_retry(build_request, service="discord")
                  _last_discord_send_at["t"] = time.monotonic()
                  print(f"Posted incident log message ({kind_key}) to incident_webhook.")
                  return True
              except Exception as error:
                  print(f"Could not post incident log message: {error}")
                  return False
          
          
          def record_repo_failure(config, error, permanent=False):
              """Track failures and alert once per persistent issue. Permanent failures alert immediately."""
              kind = config["monitor_type"]
              error_text = str(error)
          
              if permanent:
                  path = permanent_failure_state_path_for_repo(config["repo"])
                  state = _load_json_state(path)
                  failed_kinds = _safe_failed_kinds(state)
                  failed_kinds.add(kind)
                  service = getattr(error, "service", "GitHub")
                  status = getattr(error, "status", None)
                  issue_fingerprint = f"{service}:{status}"
                  if state.get("issue_fingerprint") != issue_fingerprint:
                      state["alert_sent"] = False
                  state.update({
                      "failed_kinds": sorted(failed_kinds),
                      "last_error": error_text,
                      "last_status": status,
                      "issue_fingerprint": issue_fingerprint,
                  })
          
                  if not bool(state.get("alert_sent", False)):
                      reason = (
                          f"{service} returned a permanent HTTP error while monitoring `{config['repo']}`: {error_text}. "
                          "This usually means the repository, credentials, webhook, or target is no longer valid. "
                          "Update the config or credentials if needed."
                      )
                      try:
                          send_failure_alert(config, reason)
                          state["alert_sent"] = True
                          print(f"Sent one-time permanent failure alert for {config['repo']}.")
                      except Exception as alert_error:
                          print(f"Could not send permanent failure alert for {config['repo']}: {alert_error}")
          
                  _save_json_state(path, state)
                  return
          
              path = failure_state_path_for_repo(config["repo"], kind)
              state = _load_json_state(path)
              consecutive = _safe_consecutive(state) + 1
              alert_sent = _safe_alert_sent(state)
              state.update({"consecutive": consecutive, "alert_sent": alert_sent, "last_error": error_text})
          
              if not alert_sent and consecutive >= FAILURE_ALERT_THRESHOLD:
                  reason = (
                      f"`{config['repo']}` has failed monitoring {consecutive} consecutive runs. "
                      f"The latest error was: {error_text}. "
                      "The monitor will keep retrying."
                  )
                  try:
                      send_failure_alert(config, reason)
                      state["alert_sent"] = True
                      print(f"Sent one-time transient failure alert for {config['repo']} ({kind}).")
                  except Exception as alert_error:
                      print(f"Could not send transient failure alert for {config['repo']}: {alert_error}")
          
              _save_json_state(path, state)
          
          
          def record_repo_success(config):
              """Reset the monitor-kind transient state and clear permanent state only after all failed kinds recover."""
              transient_path = failure_state_path_for_repo(config["repo"], config["monitor_type"])
              if transient_path.exists():
                  _clear_json_state(transient_path)
          
              permanent_path = permanent_failure_state_path_for_repo(config["repo"])
              permanent_state = _load_json_state(permanent_path)
              if permanent_state:
                  failed_kinds = _safe_failed_kinds(permanent_state)
                  failed_kinds.discard(config["monitor_type"])
                  if failed_kinds:
                      permanent_state["failed_kinds"] = sorted(failed_kinds)
                      _save_json_state(permanent_path, permanent_state)
                  else:
                      _clear_json_state(permanent_path)
          
          
          def record_global_rate_limit_failure(config, reset_epoch):
              """Track the workflow-wide GitHub primary rate limit and send one alert after persistence."""
              state = _load_json_state(GLOBAL_RATE_LIMIT_STATE)
              consecutive = _safe_consecutive(state) + 1
              alert_sent = _safe_alert_sent(state)
              reset_text = _format_reset_time(reset_epoch)
              state.update({
                  "consecutive": consecutive,
                  "alert_sent": alert_sent,
                  "last_reset_epoch": reset_epoch,
              })
              if not alert_sent and consecutive >= RATE_LIMIT_ALERT_THRESHOLD:
                  message = (
                      "GitHub's primary REST API rate limit has been exhausted for this monitor. "
                      f"It has affected {consecutive} consecutive workflow runs. "
                      f"GitHub reports the rate-limit reset at {reset_text}. "
                      "The monitor skipped the remaining repositories in the affected run and will retry on the next run."
                  )
                  try:
                      send_failure_alert(config, message)
                      state["alert_sent"] = True
                      print("Sent one-time primary GitHub rate-limit alert.")
                  except Exception as alert_error:
                      print(f"Could not send primary GitHub rate-limit alert: {alert_error}")
              _save_json_state(GLOBAL_RATE_LIMIT_STATE, state)
          
          
          def record_global_rate_limit_success():
              if GLOBAL_RATE_LIMIT_STATE.exists():
                  _clear_json_state(GLOBAL_RATE_LIMIT_STATE)
          
          
