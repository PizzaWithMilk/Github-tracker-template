                  + r"/(?:pull|issues)/(\d+)(?=[\s).,]|$)"
              )
          
          def _http_error_body(error):
              try:
                  return error.read().decode("utf-8", errors="replace")
              except Exception:
                  return ""
          
          
          def _looks_like_secondary_rate_limit(status, headers, body_text):
              if status == 429:
                  return True
              if status != 403:
                  return False
              if headers.get("Retry-After"):
                  return True
              message = body_text.lower()
              return (
                  "secondary rate limit" in message
                  or "abuse detection" in message
                  or "too many requests" in message
              )


          def _record_github_rate_limit_headers(headers):
              """Update the process-wide primary rate-limit budget from GitHub response headers."""
              if not headers:
                  return
              remaining_raw = headers.get("X-RateLimit-Remaining")
              limit_raw = headers.get("X-RateLimit-Limit")
              reset_raw = headers.get("X-RateLimit-Reset")
              with _github_rate_limit_lock:
                  updated = False
                  if remaining_raw is not None and str(remaining_raw).strip() != "":
                      try:
                          GITHUB_RATE_LIMIT_INFO["remaining"] = int(str(remaining_raw).strip())
                          updated = True
                      except (TypeError, ValueError):
                          pass
                  if limit_raw is not None and str(limit_raw).strip() != "":
                      try:
                          GITHUB_RATE_LIMIT_INFO["limit"] = int(str(limit_raw).strip())
                          updated = True
                      except (TypeError, ValueError):
                          pass
                  if reset_raw is not None and str(reset_raw).strip() != "":
                      try:
                          GITHUB_RATE_LIMIT_INFO["reset"] = int(str(reset_raw).strip())
                          updated = True
                      except (TypeError, ValueError):
                          pass
                  if updated:
                      GITHUB_RATE_LIMIT_INFO["observed_at"] = _now_epoch()
          
          
          def fetch_with_retry(request_factory, service="generic", return_headers=False):
              """Retry transient failures and classify GitHub primary/secondary rate limits explicitly.

              When return_headers is True, returns (body_bytes, headers) instead of body_bytes.
              """
              network_attempt = 0
              transient_http_attempt = 0
              rate_limit_attempt = 0
              primary_rate_limit_waited = False
          
              while True:
                  try:
                      req = request_factory()
                      with urllib.request.urlopen(req, timeout=30) as response:
                          if service == "github":
                              _record_github_rate_limit_headers(response.headers)
                          body = response.read()
                          if return_headers:
                              return body, response.headers
                          return body
                  except urllib.error.HTTPError as error:
                      headers = error.headers or {}
                      body_text = ""
                      if service == "github" and error.code in {403, 429, 304}:
                          if error.code in {403, 429}:
                              body_text = _http_error_body(error)
          
                      if service == "github":
                          _record_github_rate_limit_headers(headers)
                          if error.code == 304:
                              raise GitHubNotModified() from error
                          remaining = headers.get("X-RateLimit-Remaining")
                          reset = headers.get("X-RateLimit-Reset")
                          remaining_is_zero = str(remaining).strip() == "0"
                          if error.code in {403, 429} and remaining_is_zero:
                              reset_epoch = None
                              try:
                                  reset_epoch = int(reset) if reset else None
                              except (TypeError, ValueError):
                                  reset_epoch = None
          
                              if not primary_rate_limit_waited and reset_epoch is not None:
                                  wait = reset_epoch - time.time() + 1
                                  if 0 < wait <= GITHUB_RATE_LIMIT_MAX_WAIT_SECONDS:
                                      primary_rate_limit_waited = True
                                      print(
                                          f"GitHub primary rate limit is exhausted; waiting {wait:.1f}s for reset."
                                      )
                                      time.sleep(wait)
                                      continue
          
                              raise GitHubRateLimitError(
                                  reset_epoch,
                                  f"GitHub primary API rate limit exhausted (reset {_format_reset_time(reset_epoch)})."
                              ) from error
          
                          if _looks_like_secondary_rate_limit(error.code, headers, body_text):
                              if rate_limit_attempt < RATE_LIMIT_RETRY_ATTEMPTS:
                                  rate_limit_attempt += 1
                                  retry_after = headers.get("Retry-After")
                                  try:
                                      wait = float(retry_after)
                                  except (TypeError, ValueError):
                                      wait = RETRY_BACKOFF_SECONDS * rate_limit_attempt
                                  wait = min(max(wait, 0), RATE_LIMIT_MAX_WAIT_SECONDS)
                                  print(
                                      f"GitHub secondary/HTTP rate limit ({error.code}), waiting {wait:.1f}s "
                                      f"before retry ({rate_limit_attempt}/{RATE_LIMIT_RETRY_ATTEMPTS})"
                                  )
                                  time.sleep(wait)
                                  continue
                              raise
          
                          if error.code == 404:
                              raise GitHubPermanentError(
                                  404,
                                  f"GitHub returned HTTP 404 for {REPO}. The repository may have been renamed, deleted, or made private."
                              ) from error
                          if error.code == 401:
                              raise GitHubPermanentError(
                                  401,
                                  "GitHub returned HTTP 401. The GitHub token is missing, invalid, or expired."
                              ) from error
                          if error.code == 403:
                              raise GitHubPermanentError(
                                  403,
                                  "GitHub returned HTTP 403. The GitHub token is not authorized to access this repository."
                              ) from error
          
                      if error.code == 429 and rate_limit_attempt < RATE_LIMIT_RETRY_ATTEMPTS:
                          rate_limit_attempt += 1
                          retry_after = headers.get("Retry-After")
                          try:
                              wait = float(retry_after)
                          except (TypeError, ValueError):
                              wait = RETRY_BACKOFF_SECONDS * rate_limit_attempt
                          wait = min(max(wait, 0), RATE_LIMIT_MAX_WAIT_SECONDS)
                          print(
                              f"Rate limited (429), waiting {wait:.1f}s before retry "
                              f"({rate_limit_attempt}/{RATE_LIMIT_RETRY_ATTEMPTS})"
                          )
                          time.sleep(wait)
                          continue
          
                      if service in {"github", "discord"} and 500 <= error.code <= 599:
                          if transient_http_attempt < 2:
                              transient_http_attempt += 1
                              wait = RETRY_BACKOFF_SECONDS * transient_http_attempt
                              print(
                                  f"HTTP {error.code} from {service}; waiting {wait:.1f}s before retry "
                                  f"({transient_http_attempt}/2)"
                              )
                              time.sleep(wait)
                              continue
          
                      if error.code == 408:
                          if transient_http_attempt < 2:
                              transient_http_attempt += 1
                              wait = RETRY_BACKOFF_SECONDS * transient_http_attempt
                              time.sleep(wait)
                              continue
          
                      raise
                  except (urllib.error.URLError, TimeoutError) as error:
                      network_attempt += 1
                      print(f"Attempt {network_attempt}/{RETRY_ATTEMPTS} failed: {error}")
                      if network_attempt < RETRY_ATTEMPTS:
                          time.sleep(RETRY_BACKOFF_SECONDS * network_attempt)
                      else:
                          raise
          
          
          def _github_request_headers(etag=None, last_modified=None):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "GitHub-Discord-Monitor/1.0",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if GITHUB_TOKEN:
                  headers["Authorization"] = f"Bearer {GITHUB_TOKEN}"
              if etag:
                  headers["If-None-Match"] = etag
              if last_modified:
                  headers["If-Modified-Since"] = last_modified
              return headers


          def _header_value(headers, name):
              if not headers:
                  return None
              value = headers.get(name)
              if value is None:
                  for key, candidate in headers.items():
                      if str(key).lower() == name.lower():
                          value = candidate
                          break
              text = str(value or "").strip()
              return text or None


          def get_recent_commits(max_pages=1, etag=None, last_modified=None):
              """Fetch commits from the most recent GitHub API page.

              Supports conditional requests via ETag / Last-Modified. On HTTP 304,
              raises GitHubNotModified. Returns (commits, new_etag, new_last_modified).
              """
              cache_key = (REPO, "commit")
              cached = PREFETCH_CACHE.pop(cache_key, None)
              if cached is not None:
                  status = cached[0]
                  if status == "not_modified":
                      raise GitHubNotModified()
                  if status == "error":
                      raise cached[1]
                  commits, new_etag, new_last_modified = cached[1], cached[2], cached[3]
                  save_etag_state(REPO, "commit", new_etag, new_last_modified)
                  return commits

              commits = []
              new_etag = etag
              new_last_modified = last_modified
              for page in range(1, max_pages + 1):
                  separator = "&" if "?" in API_URL else "?"
                  page_url = f"{API_URL}{separator}page={page}"
                  page_etag = etag if page == 1 else None
                  page_last_modified = last_modified if page == 1 else None

                  def build_request(url=page_url, req_etag=page_etag, req_lm=page_last_modified):
                      return urllib.request.Request(
                          url, headers=_github_request_headers(req_etag, req_lm)
                      )

                  body, resp_headers = fetch_with_retry(
                      build_request, service="github", return_headers=True
                  )
                  if page == 1:
                      new_etag = _header_value(resp_headers, "ETag") or new_etag
                      new_last_modified = (
                          _header_value(resp_headers, "Last-Modified") or new_last_modified
                      )
                  batch = json.loads(body)
                  if not batch:
                      break
                  commits.extend(batch)
                  if len(batch) < 100:
                      break
              save_etag_state(REPO, "commit", new_etag, new_last_modified)
              return commits
          
          
          def build_ping(ping_mode, ping_id):
              """Returns (ping_text, allowed_mentions) for a repository's ping settings."""
              if ping_mode == "user" and ping_id:
                  return f"<@{ping_id}>", {"users": [ping_id]}
              if ping_mode == "role" and ping_id:
                  return f"<@&{ping_id}>", {"roles": [ping_id]}
              if ping_mode == "everyone":
                  return "@everyone", {"parse": ["everyone"]}
              return "", {}
          
          

          def _webhook_fingerprint(webhook_url=None):
              value = (webhook_url if webhook_url is not None else CURRENT_WEBHOOK) or ""
              return hashlib.sha256(value.encode("utf-8")).hexdigest() if value else ""


          def release_content_fingerprint(release):
              """Fingerprint a release's body and assets so later edits can be detected."""
              assets = release.get("assets") or []
              asset_sig = []
              for asset in assets:
                  if not isinstance(asset, dict):
                      continue
                  asset_sig.append(
                      {
                          "id": asset.get("id"),
                          "name": str(asset.get("name") or ""),
                          "size": asset.get("size"),
                          "updated_at": str(asset.get("updated_at") or ""),
                          "browser_download_url": str(asset.get("browser_download_url") or ""),
                      }
                  )
              asset_sig.sort(key=lambda item: (str(item.get("id") or ""), str(item.get("name") or "")))
              payload = {
                  "tag": str(release.get("tag_name") or "").strip(),
                  "name": str(release.get("name") or "").strip(),
                  "body": str(release.get("body") or ""),
                  "assets": asset_sig,
              }
              raw = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              return hashlib.sha256(raw.encode("utf-8")).hexdigest()


          def load_release_notify_state(repo):
              path = release_notify_state_path_for_repo(repo)
              return _load_json_state(path)


          def save_release_notify_state(repo, tag, fingerprint, message_ids, thread_id=None, webhook_fingerprint=None):
              """Overwrite notify state for this repo. Always represents only the newest release."""
              path = release_notify_state_path_for_repo(repo)
              data = {
                  "tag": str(tag or "").strip(),
                  "fingerprint": str(fingerprint or "").strip(),
                  "message_ids": [str(mid).strip() for mid in (message_ids or []) if str(mid).strip()],
                  "thread_id": str(thread_id).strip() if thread_id else None,
                  "webhook_fingerprint": webhook_fingerprint if webhook_fingerprint is not None else _webhook_fingerprint(),
              }
              _save_json_state(path, data)


          def edit_discord_message(message_id, components, allowed_mentions=None, thread_id=None):
              """Edit a previously posted webhook message. Returns the Discord response body."""
              last_sent = _last_discord_send_at["t"]
              if last_sent is not None:
                  elapsed = time.monotonic() - last_sent
                  if elapsed < DISCORD_SEND_DELAY_SECONDS:
                      time.sleep(DISCORD_SEND_DELAY_SECONDS - elapsed)

              if not CURRENT_WEBHOOK:
                  raise RuntimeError(f"No Discord webhook was resolved for {REPO or 'the current workflow'}.")
              if not message_id:
                  raise ValueError("edit_discord_message requires a message_id.")

              parsed_webhook = urlparse(CURRENT_WEBHOOK)
              query_params = [
                  (key, value)
                  for key, value in parse_qsl(parsed_webhook.query, keep_blank_values=True)
                  if key not in {"wait", "with_components", "thread_id"}
              ]
              query_params.append(("with_components", "true"))
              if thread_id:
                  query_params.append(("thread_id", str(thread_id)))
              path = parsed_webhook.path.rstrip("/") + f"/messages/{message_id}"
              url = urlunparse(parsed_webhook._replace(path=path, query=urlencode(query_params)))

              payload = {
                  "flags": 32768,
                  "allowed_mentions": allowed_mentions or {},
                  "components": components,
              }
              body = json.dumps(payload).encode("utf-8")

              def build_request():
                  return urllib.request.Request(
                      url,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "GitHub-Discord-Monitor/1.0",
                      },
                      method="PATCH",
                  )

              try:
                  response_body = fetch_with_retry(build_request, service="discord")
                  return json.loads(response_body) if response_body else {}
              except urllib.error.HTTPError as error:
                  error_body = _http_error_body(error)
                  print(f"Discord edit error HTTP {error.code}: {error_body}")
                  if error.code == 404:
                      raise DiscordThreadGoneError(
                          404,
                          f"Discord message {message_id} no longer exists or is not editable by this webhook.",
                      ) from error
                  if error.code in {401, 403}:
                      raise DiscordPermanentError(
                          error.code,
                          f"Discord webhook returned HTTP {error.code} while editing message {message_id}. "
                          f"Response: {error_body[:500]}",
                      ) from error
                  raise
              finally:
                  _last_discord_send_at["t"] = time.monotonic()


          def send_discord(components, allowed_mentions=None, thread_name=None, thread_id=None, applied_tags=None):
              last_sent = _last_discord_send_at["t"]
              if last_sent is not None:
                  elapsed = time.monotonic() - last_sent
                  if elapsed < DISCORD_SEND_DELAY_SECONDS:
                      time.sleep(DISCORD_SEND_DELAY_SECONDS - elapsed)
          
          
              if thread_name and thread_id:
                  raise ValueError("thread_name and thread_id are mutually exclusive")
          
              if not CURRENT_WEBHOOK:
                  raise RuntimeError(f"No Discord webhook was resolved for {REPO or 'the current workflow'}.")
          
              parsed_webhook = urlparse(CURRENT_WEBHOOK)
              query_params = [
                  (key, value)
                  for key, value in parse_qsl(parsed_webhook.query, keep_blank_values=True)
                  if key not in {"wait", "with_components"}
              ]
              if thread_id or thread_name:
                  query_params = [(key, value) for key, value in query_params if key != "thread_id"]
              query_params.extend([("wait", "true"), ("with_components", "true")])
              if thread_id:
                  query_params.append(("thread_id", str(thread_id)))
              url = urlunparse(parsed_webhook._replace(query=urlencode(query_params)))
          
              payload = {
                  "flags": 32768,
                  "allowed_mentions": allowed_mentions or {},
                  "components": components,
              }
          
              if thread_name:
                  payload["thread_name"] = thread_name
                  if applied_tags:
                      payload["applied_tags"] = [str(tag_id) for tag_id in applied_tags]
          
          
              body = json.dumps(payload).encode("utf-8")
          
              def build_request():
                  return urllib.request.Request(
                      url,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "GitHub-Discord-Monitor/1.0",
                      },
                      method="POST",
                  )
          
              try:
                  response_body = fetch_with_retry(build_request, service="discord")
                  return json.loads(response_body) if response_body else {}
              except urllib.error.HTTPError as error:
                  error_body = _http_error_body(error)
                  print(f"Discord error HTTP {error.code}: {error_body}")
                  if error.code == 404 and thread_id:
                      raise DiscordThreadGoneError(404, f"Discord Forum thread {thread_id} no longer exists.") from error
                  if error.code in {401, 403, 404}:
                      raise DiscordPermanentError(
                          error.code,
                          f"Discord webhook returned HTTP {error.code}. The webhook may be invalid, deleted, or unauthorized. Response: {error_body[:500]}",
                      ) from error
                  raise
              finally:
                  _last_discord_send_at["t"] = time.monotonic()
          
          
          def make_forum_title(title):
              title = re.sub(r"\s+", " ", title).strip()
              return title[:100].rstrip()
          
          
          
          def load_thread_progress():
              """Load durable Forum-post resume state, refusing ambiguous/corrupt state."""
              if not THREAD_STATE.exists():
                  return None
              try:
                  data = json.loads(THREAD_STATE.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  raise RuntimeError(f"Could not read Forum thread progress state safely: {error}") from error
          
              if not isinstance(data, dict):
                  raise RuntimeError("Forum thread progress state is not an object.")
          
              required = ("repo", "kind", "item_id", "thread_id", "next_part", "total_parts", "fingerprint")
              missing = [key for key in required if key not in data]
              if missing:
                  print(
                      "Forum thread progress state is missing required fields: "
                      + ", ".join(missing)
                      + "; discarding stale resume state."
                  )
                  clear_thread_progress()
                  return None
              if not all(str(data.get(key, "")).strip() for key in ("repo", "kind", "item_id", "thread_id", "fingerprint")):
                  print("Forum thread progress state contains an empty required value; discarding stale resume state.")
                  clear_thread_progress()
                  return None
              if data.get("kind") not in {"commit", "release"}:
                  raise RuntimeError(f"Forum thread progress state has invalid kind: {data.get('kind')!r}.")
              try:
                  next_part = int(data["next_part"])
                  total_parts = int(data["total_parts"])
              except (TypeError, ValueError) as error:
                  raise RuntimeError("Forum thread progress state has a non-numeric part index.") from error
              if total_parts < 1 or next_part < 1 or next_part > total_parts + 1:
                  raise RuntimeError(
                      f"Forum thread progress state has invalid part range: next_part={next_part}, total_parts={total_parts}."
                  )
              return data
          
          
          def save_thread_progress(repo, kind, item_id, thread_id, next_part, total_parts, forum_title, fingerprint):
              """Persist the repo, item, thread ID, next continuation part, and content fingerprint."""
              THREAD_STATE.parent.mkdir(parents=True, exist_ok=True)
              fingerprint = str(fingerprint or "").strip()
              if not fingerprint:
                  raise ValueError("Forum thread progress requires a content fingerprint.")
              data = {
                  "repo": repo,
                  "kind": kind,
                  "item_id": item_id,
                  "thread_id": str(thread_id),
                  "next_part": int(next_part),
                  "total_parts": int(total_parts),
                  "forum_title": forum_title,
                  "fingerprint": fingerprint,
              }
          
              temp_path = THREAD_STATE.with_name(THREAD_STATE.name + ".tmp")
              temp_path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
              temp_path.replace(THREAD_STATE)
          
          
          def clear_thread_progress():
              """Remove resume state once the Forum post is completely finished."""
              try:
                  THREAD_STATE.unlink()
              except FileNotFoundError:
                  pass
          
          
          def delivery_fingerprint(messages, title, meta_block, kind):
              payload = {
                  "messages": messages,
                  "title": title,
                  "meta": meta_block,
                  "kind": kind,
              }
              raw = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              return hashlib.sha256(raw.encode("utf-8")).hexdigest()
          
          
          def load_delivery_progress():
              """Load normal-channel multi-part delivery progress, if a previous run stopped mid-item."""
              if not DELIVERY_STATE.exists():
                  return None
              try:
                  data = json.loads(DELIVERY_STATE.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  raise RuntimeError(f"Could not read normal delivery progress state: {error}") from error
              if not isinstance(data, dict):
                  raise RuntimeError("Normal delivery progress state is not an object.")
              required = ("repo", "kind", "item_id", "next_part", "total_parts", "fingerprint")
              missing = [key for key in required if key not in data]
              if missing:
                  raise RuntimeError(
                      "Normal delivery progress state is missing required fields: " + ", ".join(missing)
                  )
              if not all(str(data.get(key, "")).strip() for key in ("repo", "kind", "item_id", "fingerprint")):
                  raise RuntimeError("Normal delivery progress state contains an empty required value.")
              if data.get("kind") not in {"commit", "release"}:
                  raise RuntimeError(f"Normal delivery progress state has invalid kind: {data.get('kind')!r}.")
              try:
                  next_part = int(data["next_part"])
                  total_parts = int(data["total_parts"])
              except (TypeError, ValueError) as error:
                  raise RuntimeError("Normal delivery progress state has a non-numeric part index.") from error
              if total_parts < 1 or next_part < 1 or next_part > total_parts + 1:
                  raise RuntimeError(
                      f"Normal delivery progress state has invalid part range: next_part={next_part}, total_parts={total_parts}."
                  )
              return data
          
          
          def save_delivery_progress(repo, kind, item_id, next_part, total_parts, fingerprint):
              """Persist normal-channel multi-part delivery state after each successfully sent part."""
              DELIVERY_STATE.parent.mkdir(parents=True, exist_ok=True)
              data = {
                  "repo": repo,
                  "kind": kind,
                  "item_id": item_id,
                  "next_part": int(next_part),
                  "total_parts": int(total_parts),
                  "fingerprint": fingerprint,
              }
              temp_path = DELIVERY_STATE.with_name(DELIVERY_STATE.name + ".tmp")
              temp_path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
              temp_path.replace(DELIVERY_STATE)
          
          
          def clear_delivery_progress():
              try:
                  DELIVERY_STATE.unlink()
              except FileNotFoundError:
                  pass
          
          
          ISSUE_REF_PATTERN = re.compile(r"(?<![\[\w/#])#(\d+)(?!\w)")
          ISSUE_URL_PATTERN = re.compile(r"a^b")
          
          
          def linkify_issue_refs(text):
              text = ISSUE_URL_PATTERN.sub(
                  lambda m: f"[#{m.group(1)}]({m.group(0)})", text
              )
              text = ISSUE_REF_PATTERN.sub(
                  lambda m: f"[#{m.group(1)}]({CURRENT_GITHUB_WEB_BASE_URL}/{REPO}/issues/{m.group(1)})",
                  text,
              )
              return text
          
          
          VERSION_PATTERN_EXPLICIT = re.compile(
              r"(?i)\b(?:version|ver|update|updated|release|bump|bumped)(?:\s+to)?\s*[:=#-]?\s*(v?\d+(?:\.\d+){1,3}(?:[-+][0-9A-Za-z.-]+)?)\b"
          )
          VERSION_PATTERN_BARE = re.compile(
              r"(?<![\w.-])(v\d+(?:\.\d+){1,3}(?:[-+][0-9A-Za-z.-]+)?)(?![\w.-])",
              re.IGNORECASE,
          )
          VERSION_PATTERN_NUMERIC_BARE = re.compile(
              r"(?<![\w.-])(\d+(?:\.\d+){2,3}(?:[-+][0-9A-Za-z.-]+)?)(?![\w.-])"
          )
          
          
          def extract_update_version(message):
              """Find an update/release version in a commit message, or return Unknown."""
              match = VERSION_PATTERN_EXPLICIT.search(message)
              if match:
                  return match.group(1)
          
              match = VERSION_PATTERN_BARE.search(message)
              if match:
                  return match.group(1)
          
              match = VERSION_PATTERN_NUMERIC_BARE.search(message)
              if match:
                  return match.group(1)
          
              return "Unknown"
          
          
          CHANGE_SECTION_RE = re.compile(
              r"^\s*(?:#{1,6}\s*)?(Added|Add|Removed|Remove|Changed|Change|Fixed|Fix)(?:\s+(?:changes?|items?|entries?))?\s*:?\s*$",
              re.IGNORECASE,
          )
          CHANGE_VERB_RE = re.compile(
              r"\b(added|adds|add|removed|removes|remove|changed|changes|change|modified|modifies|modify|fixed|fixes|fix)\b\s*(?::|-)?\s*",
              re.IGNORECASE,
          )
          BULLET_RE = re.compile(r"^\s*(?:[-*•]|\d+[.)])\s+(.+?)\s*$")
          NOISE_ONLY_RE = re.compile(
              r"^(?:the\s+)?(?:readme|documentation|docs?|comments?|whitespace|formatting|lint(?:ing)?|code\s+style|style\s+cleanup|ci|github\s+actions?|workflow|tests?|test\s+updates?|dependency\s+bump|dependency\s+update|dependencies?\s+(?:updated|bumped|upgraded))$",
              re.IGNORECASE,
          )
          
          CHANGE_SECTION_NAMES = {
              "add": "Added",
              "adds": "Added",
              "added": "Added",
              "remove": "Removed",
              "removes": "Removed",
              "removed": "Removed",
              "change": "Changed",
              "changes": "Changed",
              "changed": "Changed",
              "modify": "Changed",
              "modifies": "Changed",
              "modified": "Changed",
              "fix": "Fixed",
              "fixes": "Fixed",
              "fixed": "Fixed",
          }
          
          def _clean_change_description(text):
              text = re.sub(r"^\s*(?:[-*•]|\d+[.)])\s+", "", text).strip()
              text = text.strip(" \t:-")
              text = re.sub(r"\s+", " ", text)
              return text
          
          
          def _is_noise_only(text):
              cleaned = re.sub(r"[\*`_#]+", "", text).strip(" .,:;-\t")
              return not cleaned or bool(NOISE_ONLY_RE.fullmatch(cleaned))
          
          
          def _add_change(changes, category, description):
              description = _clean_change_description(description)
              if len(description) < 3 or _is_noise_only(description):
                  return
              bucket = changes.setdefault(category, [])
              if description not in bucket:
                  bucket.append(description)
          
          
          def _extract_verb_segments(line, changes):
              matches = list(CHANGE_VERB_RE.finditer(line))
              if not matches:
                  return
              for index, match in enumerate(matches):
                  verb = match.group(1).lower()
                  category = CHANGE_SECTION_NAMES.get(verb)
                  if not category:
                      continue
                  start = match.end()
                  end = matches[index + 1].start() if index + 1 < len(matches) else len(line)
                  description = line[start:end].strip()
                  description = re.sub(r"^(?:and|but|then)\s+", "", description, flags=re.IGNORECASE)
                  description = re.sub(r"\s+(?:and|but|then)$", "", description, flags=re.IGNORECASE)
                  _add_change(changes, category, description)
          
          
          def extract_meaningful_update(message):
              """Extract user-facing Added/Removed/Changed/Fixed information from a commit message.
          
              Formatting is optional. Changelog labels, section headings, bullet lists, and ordinary
              sentences are all supported. A plain version/update line is not enough by itself.
              """
              changes = {"Added": [], "Removed": [], "Changed": [], "Fixed": []}
              active_section = None
          
              for raw_line in message.splitlines():
                  line = raw_line.strip()
                  if not line:
                      active_section = None
                      continue
          
                  section_match = CHANGE_SECTION_RE.match(line)
                  if section_match:
                      active_section = CHANGE_SECTION_NAMES[section_match.group(1).lower()]
                      continue
          
                  bullet_match = BULLET_RE.match(line)
                  if active_section and bullet_match:
                      _add_change(changes, active_section, bullet_match.group(1))
                      continue
          
                  if extract_update_version(line) != "Unknown" and not re.search(
                      r"\b(?:added|adds|add|removed|removes|remove|changed|changes|change|modified|modifies|modify|fixed|fixes|fix)\b",
                      line,
                      re.IGNORECASE,
                  ):
                      continue
          
                  _extract_verb_segments(line, changes)
          
              ordered = [(name, items) for name, items in changes.items() if items]
              if not ordered:
                  return None
          
              return "\n\n".join(
                  "### " + name + "\n" + "\n".join(f"- {item}" for item in items)
                  for name, items in ordered
              )
          
          
          def commit_is_bot(commit):
              """Ignore GitHub/automation bot authors unconditionally."""
              identities = []
              for key in ("author", "committer"):
                  user = commit.get(key) or {}
                  if str(user.get("type", "")).strip().lower() == "bot":
                      return True
                  for field in ("login", "name", "email"):
                      value = user.get(field)
                      if value:
                          identities.append(str(value).strip().lower())
          
              commit_data = commit.get("commit") or {}
              for key in ("author", "committer"):
                  identity = commit_data.get(key) or {}
                  for field in ("name", "email"):
                      value = identity.get(field)
                      if value:
                          identities.append(str(value).strip().lower())
          
              return any(
                  identity.endswith("[bot]")
                  or ("github-actions" in identity and "bot" in identity)
                  or ("dependabot" in identity and "bot" in identity)
                  for identity in identities
              )
          
          
          def analyze_commit(commit):
              """Return extracted user-facing update data, or None for bots, merges, or non-update commits."""
              if commit_is_bot(commit):
                  return None
              if len(commit.get("parents") or []) > 1:
                  return None
          
              raw_message = (commit.get("commit") or {}).get("message", "").strip()
              if not raw_message:
                  return None
          
              meaningful = extract_meaningful_update(raw_message)
              if not meaningful:
                  return None
          
              return {
                  "version": extract_update_version(raw_message),
                  "message": meaningful,
              }
          
          
          def commit_meta(commit):
              sha = commit["sha"]
              short_sha = sha[:7]
              commit_url = commit["html_url"]
              author = commit.get("author") or {}
              author_name = (
                  author.get("login")
                  or commit["commit"]["author"].get("name", "Unknown")
              )
              analysis = commit.get("_update_analysis") or analyze_commit(commit)
              if not analysis:
                  return short_sha, commit_url, author_name, "", ""
              message = linkify_issue_refs(analysis["message"])
              return short_sha, commit_url, author_name, analysis["version"], message
          
          
          HEADING_PATTERN = re.compile(r"^#{1,6}\s+\S")
          
          
          def is_heading_line(line):
              return bool(HEADING_PATTERN.match(line))
          
          
          def split_long_line(line, capacity):
              """Break a line into pieces <= capacity, splitting on whitespace only."""
              if len(line) <= capacity:
                  return [line]
              pieces = []
              remaining = line
              while len(remaining) > capacity:
                  cut = remaining.rfind(" ", 0, capacity + 1)
                  if cut <= 0:
                      cut = capacity
                  pieces.append(remaining[:cut].rstrip())
                  remaining = remaining[cut:].lstrip()
              if remaining:
                  pieces.append(remaining)
              return pieces
          
          
          def pack_messages(text, first_text_capacity, rest_text_capacity,
                             first_component_capacity, rest_component_capacity):
              """Pack text into Discord messages (lists of ("text", str)/("sep", None) pieces) under Discord's per-message limits."""
              atom_capacity = max(min(first_text_capacity, rest_text_capacity), MIN_CHUNK)
          
              atoms = []
              for line in text.split("\n"):
                  pieces = split_long_line(line, atom_capacity)
                  heading = is_heading_line(line)
                  for i, piece in enumerate(pieces):
                      atoms.append((piece, heading and i == 0))
          
              messages = []
              current_msg = []
              current_text = []
              msg_text_len = 0
              msg_component_count = 0
              text_capacity = max(first_text_capacity, MIN_CHUNK)
              component_capacity = max(first_component_capacity, 1)
              first_atom = True
          
              def close_text():
                  nonlocal msg_component_count
                  if current_text:
                      current_msg.append(("text", "\n".join(current_text)))
                      current_text.clear()
                      msg_component_count += 1
          
              def close_message():
                  nonlocal msg_text_len, msg_component_count, text_capacity, component_capacity
                  close_text()
                  if current_msg:
                      messages.append(list(current_msg))
                      current_msg.clear()
                  msg_text_len = 0
                  msg_component_count = 0
                  text_capacity = max(rest_text_capacity, MIN_CHUNK)
                  component_capacity = max(rest_component_capacity, 1)
          
              for atom_text, starts_heading in atoms:
                  if starts_heading and not first_atom:
                      pending_close_cost = 1 if current_text else 0
                      projected_components = msg_component_count + pending_close_cost + 1
                      if (msg_text_len + len(atom_text) > text_capacity
                              or projected_components > component_capacity):
                          close_message()
                      else:
                          close_text()
                          current_msg.append(("sep", None))
                          msg_component_count += 1
                      current_text.append(atom_text)
                      msg_text_len += len(atom_text)
                  else:
                      joined_len = len(atom_text) + (1 if current_text else 0)
                      if msg_text_len + joined_len > text_capacity:
                          close_message()
                          current_text.append(atom_text)
                          msg_text_len += len(atom_text)
                      else:
                          current_text.append(atom_text)
                          msg_text_len += joined_len
                  first_atom = False
          
              close_message()
              return messages or [[("text", text)]]
          
          
          def _clear_incompatible_progress(item_ids=None):
              """Remove resume files for items that are being intentionally skipped."""
              if item_ids is None:
                  clear_delivery_progress()
                  clear_thread_progress()
                  return
          
              selected = {str(item) for item in item_ids}
              delivery = load_delivery_progress() if DELIVERY_STATE.exists() else None
              if delivery and (
                  delivery.get("repo") != REPO
                  or delivery.get("kind") != MONITOR_KIND
                  or str(delivery.get("item_id")) not in selected
              ):
                  clear_delivery_progress()
          
              thread = load_thread_progress() if THREAD_STATE.exists() else None
              if thread and (
                  thread.get("repo") != REPO
                  or thread.get("kind") != MONITOR_KIND
                  or str(thread.get("item_id")) not in selected
              ):
                  clear_thread_progress()
          
          
          def send_forum_part(components, mentions, index, total, forum_title, kind, item_id, thread_id, applied_tags):
              """Send a Forum continuation, recreating the thread if Discord says the old thread is gone."""
              try:
                  send_discord(components, mentions, thread_id=thread_id)
                  return thread_id
              except DiscordThreadGoneError:
                  print(f"Saved Forum thread {thread_id} no longer exists; creating a fresh Forum post.")
                  clear_thread_progress()
                  response = send_discord(
                      components,
                      mentions,
                      thread_name=make_forum_title(f"{forum_title} (continued)"),
                      applied_tags=applied_tags,
                  )
                  new_thread_id = response.get("channel_id")
                  if not new_thread_id:
                      raise RuntimeError("Discord created the replacement Forum post but did not return its thread/channel ID.")
                  return str(new_thread_id)
          
          
          def _normal_delivery_start(item_id, total_parts, fingerprint):
              progress = load_delivery_progress()
              if not progress:
                  return 1
          
              if (
                  progress["repo"] != REPO
                  or progress["kind"] != MONITOR_KIND
                  or progress["item_id"] != item_id
              ):
                  raise RuntimeError(
                      f"Stale normal-channel delivery progress exists for {REPO}: "
                      f"repo={progress.get('repo', 'unknown')}, kind={progress.get('kind', 'unknown')}, "
                      f"item={progress.get('item_id', 'unknown')}. Refusing to restart automatically to avoid a duplicate post."
                  )
          
              saved_fingerprint = str(progress.get("fingerprint", "")).strip()
              if saved_fingerprint and saved_fingerprint != fingerprint:
                  raise RuntimeError(
                      f"Saved normal-channel delivery content for {REPO} {MONITOR_KIND} item {item_id} "
                      "no longer matches the current content. Refusing to restart automatically to avoid mixed or duplicate parts."
                  )
          
              start_index = int(progress["next_part"])
              saved_total = int(progress["total_parts"])
          
              if saved_total != total_parts:
                  raise RuntimeError(
                      f"Saved normal-channel delivery for {REPO} {MONITOR_KIND} item {item_id} expects "
                      f"{saved_total} parts, but the current content is {total_parts} parts."
                  )
              if start_index < 1 or start_index > total_parts + 1:
                  raise RuntimeError(
                      f"Saved normal-channel delivery for {REPO} {MONITOR_KIND} item {item_id} has invalid next_part={start_index}."
                  )
              return start_index
          
          
          def send_commit(commit, ping, note=None, applied_tags=None, ping_mode=None, ping_id=None):
              short_sha, commit_url, author_name, version, message = commit_meta(commit)
          
              title = f"## {PROJECT_NAME} Updated!"
              meta_lines = (
                  f"**Author:** {author_name}\n"
                  f"**Version:** {version}\n"
                  f"**Link:** {commit_url}"
              )
              meta_block = f"{note}\n\n{meta_lines}" if note else meta_lines
          
              ping_text, ping_mentions = build_ping(ping_mode, ping_id) if ping else ("", {})
          
              changelog_heading = "## Change Log:"
              first_overhead = len(ping_text) + len(title) + len(meta_block) + len(changelog_heading) + 1
              first_text_capacity = TOTAL_MESSAGE_BUDGET - first_overhead
              rest_text_capacity = TOTAL_MESSAGE_BUDGET - CONTINUATION_LABEL_OVERHEAD
              first_component_capacity = MAX_TOTAL_COMPONENTS - FIRST_FIXED_COMPONENTS
              rest_component_capacity = MAX_TOTAL_COMPONENTS - CONTINUATION_FIXED_COMPONENTS
          
              messages = pack_messages(
                  message, first_text_capacity, rest_text_capacity,
                  first_component_capacity, rest_component_capacity,
              )
              total = len(messages)
          
              if CURRENT_REPO_TYPE != "forum":
                  fingerprint = delivery_fingerprint(messages, title, meta_block, "commit")
                  start_index = _normal_delivery_start(commit["sha"], total, fingerprint)
                  if start_index > total:
                      clear_delivery_progress()
                      return
          
                  for index in range(start_index, total + 1):
                      pieces = messages[index - 1]
                      components = []
                      mentions = {}
                      if index == 1 and ping_text:
                          components.append({"type": 10, "content": ping_text})
                          mentions = ping_mentions
          
                      container = []
                      if index == 1:
                          container.append({"type": 10, "content": title})
                          container.append({"type": 14, "spacing": 1})
                          container.append({"type": 10, "content": meta_block})
                          container.append({"type": 14, "spacing": 1})
                          heading_prefix = changelog_heading
                      else:
                          heading_prefix = f"## Change Log (continued) — Part {index}/{total}:"
          
                      first_text_done = False
                      for kind, content in pieces:
                          if kind == "sep":
                              container.append({"type": 14, "spacing": 2})
                          else:
                              if not first_text_done:
                                  content = f"{heading_prefix}\n{content}"
                                  first_text_done = True
                              container.append({"type": 10, "content": content})
          
                      components.append(make_container(container, CURRENT_ACCENT_COLOR))
                      send_discord(components, mentions)
                      save_delivery_progress(REPO, "commit", commit["sha"], index + 1, total, fingerprint)
                  clear_delivery_progress()
                  return
          
              forum_title = make_forum_title(f"{PROJECT_NAME} Updated! — Version {version}")
              forum_fingerprint = delivery_fingerprint(messages, title, meta_block, "commit")
              progress = load_thread_progress()
              thread_id = None
              start_index = 1
          
              if (
                  progress
                  and progress.get("repo", REPO) == REPO
                  and progress.get("kind") == "commit"
                  and progress.get("item_id") == commit["sha"]
                  and progress.get("thread_id")
              ):
                  saved_fingerprint = str(progress.get("fingerprint", "")).strip()
                  if saved_fingerprint and saved_fingerprint != forum_fingerprint:
                      print(
                          f"Forum continuation content for {REPO} commit {commit['sha']} changed; discarding stale thread progress "
                          "and creating a fresh Forum post."
                      )
                      clear_thread_progress()
                      progress = None
                  else:
                      thread_id = str(progress["thread_id"])
                      try:
                          start_index = int(progress.get("next_part", 1))
                      except (TypeError, ValueError):
                          start_index = 1
                      if start_index < 1 or start_index > total + 1:
                          print("Invalid saved continuation position; starting a new Forum post.")
                          thread_id = None
                          start_index = 1
                      else:
                          print(f"Resuming Forum post {thread_id} for commit {short_sha} at part {start_index}/{total}.")
          
              if progress and (
                  progress.get("repo", REPO) != REPO
                  or progress.get("kind") != "commit"
                  or progress.get("item_id") != commit["sha"]
              ):
                  print(
                      f"Ignoring stale Forum thread progress (repo={progress.get('repo', 'unknown')}, "
                      f"kind={progress.get('kind', 'unknown')}, item={progress.get('item_id', 'unknown')}) "
                      f"while processing repo={REPO}, item={commit['sha']}."
                  )
          
              for index in range(start_index, total + 1):
                  pieces = messages[index - 1]
                  components = []
                  mentions = {}
                  if index == 1 and ping_text:
                      components.append({"type": 10, "content": ping_text})
                      mentions = ping_mentions
          
                  container = []
                  if index == 1:
                      container.extend([
                          {"type": 10, "content": title},
                          {"type": 14, "spacing": 1},
                          {"type": 10, "content": meta_block},
                          {"type": 14, "spacing": 1},
                      ])
                      heading_prefix = changelog_heading
                  else:
                      heading_prefix = f"## Change Log (continued) — Part {index}/{total}:"
          
                  first_text_done = False
                  for kind, content in pieces:
                      if kind == "sep":
                          container.append({"type": 14, "spacing": 2})
                      else:
                          if not first_text_done:
                              content = f"{heading_prefix}\n{content}"
                              first_text_done = True
                          container.append({"type": 10, "content": content})
                  components.append(make_container(container, CURRENT_ACCENT_COLOR))
          
                  if index == 1 and thread_id is None:
                      response = send_discord(components, mentions, thread_name=forum_title, applied_tags=applied_tags)
                      thread_id = response.get("channel_id")
                      if not thread_id:
                          raise RuntimeError("Discord created the Forum post but did not return its thread/channel ID.")
                      save_thread_progress(REPO, "commit", commit["sha"], thread_id, 2, total, forum_title, forum_fingerprint)
                  else:
                      thread_id = send_forum_part(
                          components, mentions, index, total, forum_title, "commit", commit["sha"], thread_id, applied_tags
                      )
                      save_thread_progress(REPO, "commit", commit["sha"], thread_id, index + 1, total, forum_title, forum_fingerprint)
          
              clear_thread_progress()
          
          def get_recent_releases(etag=None, last_modified=None):
              """Fetch published non-prerelease releases.

              Supports conditional requests via ETag / Last-Modified. On HTTP 304,
              raises GitHubNotModified.
              """
              cache_key = (REPO, "release")
              cached = PREFETCH_CACHE.pop(cache_key, None)
              if cached is not None:
                  status = cached[0]
                  if status == "not_modified":
                      raise GitHubNotModified()
                  if status == "error":
                      raise cached[1]
                  releases, new_etag, new_last_modified = cached[1], cached[2], cached[3]
                  save_etag_state(REPO, "release", new_etag, new_last_modified)
                  return releases

              def build_request():
                  return urllib.request.Request(
                      API_URL, headers=_github_request_headers(etag, last_modified)
                  )

              body, resp_headers = fetch_with_retry(
                  build_request, service="github", return_headers=True
              )
              new_etag = _header_value(resp_headers, "ETag") or etag
              new_last_modified = _header_value(resp_headers, "Last-Modified") or last_modified
              releases = json.loads(body)
              filtered = [
                  r for r in releases
                  if not r.get("draft")
                  and not r.get("prerelease")
                  and str(r.get("tag_name") or "").strip()
              ]
              save_etag_state(REPO, "release", new_etag, new_last_modified)
              return filtered
          
          def _format_bytes(num_bytes):
              """Format a byte count as a short human-readable size (e.g. 42.1 MB)."""
              try:
                  value = int(num_bytes)
              except (TypeError, ValueError):
                  return ""
              if value < 0:
                  return ""
              units = ["B", "KB", "MB", "GB", "TB"]
              size = float(value)
              unit_index = 0
              while size >= 1024 and unit_index < len(units) - 1:
                  size /= 1024.0
                  unit_index += 1
              if unit_index == 0:
                  return f"{int(size)} {units[unit_index]}"
              if size >= 100 or abs(size - round(size)) < 0.05:
                  return f"{size:.0f} {units[unit_index]}"
              return f"{size:.1f} {units[unit_index]}"


          def _format_release_asset_line(asset):
              """One markdown bullet for a release asset, including size when known."""
              if not isinstance(asset, dict):
                  return ""
              name = str(asset.get("name") or "").strip()
              download_url = str(asset.get("browser_download_url") or "").strip()
              if not name or not download_url:
                  return ""
              size_text = _format_bytes(asset.get("size"))
              if size_text:
                  return f"- [{name}]({download_url}) ({size_text})"
              return f"- [{name}]({download_url})"


          def release_meta(release):
              tag = str(release.get("tag_name") or "").strip()
              release_url = str(release.get("html_url") or "").strip()
              author = (release.get("author") or {}).get("login") or "Unknown"
              raw_notes = (release.get("body") or "").strip() or "(No release notes.)"
          
              if CURRENT_SHORT_SUMMARY:
                  note_lines = raw_notes.splitlines()
                  selected = note_lines[:CURRENT_SUMMARY_LINES]
                  notes = "\n".join(selected).strip() or "(No release notes.)"
                  if len(note_lines) > CURRENT_SUMMARY_LINES:
                      notes += "\n\n_Release notes shortened for this notification._"
                  if release_url:
                      notes += f"\n\n[View full release]({release_url})"
              else:
                  notes = raw_notes
          
              notes = linkify_issue_refs(notes)
          
              if CURRENT_RELEASE_ASSETS:
                  assets = release.get("assets") or []
                  asset_lines = []
                  for asset in assets:
                      line = _format_release_asset_line(asset)
                      if line:
                          asset_lines.append(line)
                  if asset_lines:
                      total_assets = len(asset_lines)
                      shown_asset_lines = asset_lines[:MAX_RELEASE_ASSETS_LISTED]
                      notes += "\n\n## Release Assets:\n" + "\n".join(shown_asset_lines)
                      if total_assets > MAX_RELEASE_ASSETS_LISTED:
                          notes += (
                              f"\n\n_Showing {MAX_RELEASE_ASSETS_LISTED} of {total_assets} release assets. "
                              + (f"[View the GitHub release]({release_url}) for all assets._" if release_url else "View the GitHub release for all assets._")
                          )
          
              return tag, release_url, author, notes
          
          def _build_release_part_components(
              index,
              total,
              pieces,
              title,
              meta_block,
              notes_heading,
              ping_text,
              ping_mentions,
          ):
              """Build Discord components for one release notification part."""
              components = []
              mentions = {}
              if index == 1 and ping_text:
                  components.append({"type": 10, "content": ping_text})
                  mentions = ping_mentions

              container = []
              if index == 1:
                  container.extend([
                      {"type": 10, "content": title},
                      {"type": 14, "spacing": 1},
                      {"type": 10, "content": meta_block},
                      {"type": 14, "spacing": 1},
                  ])
                  heading_prefix = notes_heading
              else:
                  heading_prefix = f"## Release Notes (continued) — Part {index}/{total}:"

              first_text_done = False
              for kind, content in pieces:
                  if kind == "sep":
                      container.append({"type": 14, "spacing": 2})
                  else:
                      if not first_text_done:
                          content = f"{heading_prefix}\n{content}"
                          first_text_done = True
                      container.append({"type": 10, "content": content})
              components.append(make_container(container, CURRENT_ACCENT_COLOR))
              return components, mentions


          def send_release(
              release,
              ping,
              note=None,
              applied_tags=None,
              ping_mode=None,
              ping_id=None,
              edited=False,
              prior_message_ids=None,
              prior_thread_id=None,
          ):
              """Post or update a release notification.

              Returns a dict with message_ids, thread_id, and content_fingerprint for
              durable edited-release tracking. When edited=True and prior_message_ids
              are available, existing Discord messages are patched in place; otherwise
              a new post is created.
              """
              tag, release_url, author, notes = release_meta(release)
              content_fp = release_content_fingerprint(release)

              if edited:
                  title = f"## {PROJECT_NAME} Updated! (edited)"
                  edit_note = "_This release was edited on GitHub._"
                  note = f"{edit_note}\n\n{note}" if note else edit_note
              else:
                  title = f"## {PROJECT_NAME} Updated!"

              meta_lines = (
                  f"**Version:** {tag}\n"
                  f"**Author:** {author}\n"
                  f"**Release:** {release_url}"
              )
              meta_block = f"{note}\n\n{meta_lines}" if note else meta_lines
              effective_ping = True if edited else bool(ping)
              ping_text, ping_mentions = build_ping(ping_mode, ping_id) if effective_ping else ("", {})

              notes_heading = "## Release Notes:"
              first_overhead = len(ping_text) + len(title) + len(meta_block) + len(notes_heading) + 1
              first_text_capacity = TOTAL_MESSAGE_BUDGET - first_overhead
              rest_text_capacity = TOTAL_MESSAGE_BUDGET - CONTINUATION_LABEL_OVERHEAD
              first_component_capacity = MAX_TOTAL_COMPONENTS - FIRST_FIXED_COMPONENTS
              rest_component_capacity = MAX_TOTAL_COMPONENTS - CONTINUATION_FIXED_COMPONENTS

              messages = pack_messages(
                  notes, first_text_capacity, rest_text_capacity,
                  first_component_capacity, rest_component_capacity,
              )
              total = len(messages)
              prior_ids = [str(mid).strip() for mid in (prior_message_ids or []) if str(mid).strip()]
              prior_thread = str(prior_thread_id).strip() if prior_thread_id else None

              def _empty_result():
                  return {
                      "message_ids": [],
                      "thread_id": None,
                      "content_fingerprint": content_fp,
                      "tag": tag,
                  }

              if edited and prior_ids:
                  collected_ids = []
                  thread_id = prior_thread
                  try:
                      for index in range(1, total + 1):
                          pieces = messages[index - 1]
                          components, mentions = _build_release_part_components(
                              index, total, pieces, title, meta_block, notes_heading, ping_text, ping_mentions
                          )
                          if index <= len(prior_ids):
                              message_id = prior_ids[index - 1]
                              response = edit_discord_message(
                                  message_id, components, mentions, thread_id=thread_id
                              )
                              returned_id = str(response.get("id") or message_id).strip()
                              collected_ids.append(returned_id or message_id)
                              print(
                                  f"Edited Discord release message {message_id} for {REPO} {tag} "
                                  f"(part {index}/{total})."
                              )
                          else:
                              if CURRENT_REPO_TYPE == "forum":
                                  if thread_id is None:
                                      raise RuntimeError(
                                          "Cannot append forum continuation parts without a thread_id."
                                      )
                                  response = send_discord(components, mentions, thread_id=thread_id)
                              else:
                                  response = send_discord(components, mentions)
                              new_id = str(response.get("id") or "").strip()
                              if new_id:
                                  collected_ids.append(new_id)
                              if CURRENT_REPO_TYPE == "forum" and response.get("channel_id"):
                                  thread_id = str(response.get("channel_id"))
                              print(
                                  f"Posted additional release part {index}/{total} for edited {REPO} {tag}."
                              )
                      return {
                          "message_ids": collected_ids,
                          "thread_id": thread_id,
                          "content_fingerprint": content_fp,
                          "tag": tag,
                      }
                  except (DiscordThreadGoneError, DiscordPermanentError) as error:
                      print(
                          f"Could not edit prior Discord release message(s) for {REPO} {tag}: {error}. "
                          "Posting a fresh release notification instead."
                      )
                  except Exception as error:
                      print(
                          f"Unexpected error editing release message(s) for {REPO} {tag}: {error}. "
                          "Posting a fresh release notification instead."
                      )

              if CURRENT_REPO_TYPE != "forum":
                  fingerprint = delivery_fingerprint(messages, title, meta_block, "release")
                  start_index = 1 if edited else _normal_delivery_start(tag, total, fingerprint)
                  if start_index > total:
                      clear_delivery_progress()
                      return _empty_result()

                  collected_ids = list(prior_ids[: start_index - 1]) if not edited else []
                  for index in range(start_index, total + 1):
                      pieces = messages[index - 1]
                      components, mentions = _build_release_part_components(
                          index, total, pieces, title, meta_block, notes_heading, ping_text, ping_mentions
                      )
                      response = send_discord(components, mentions)
                      new_id = str(response.get("id") or "").strip()
                      if new_id:
                          collected_ids.append(new_id)
                      if not edited:
                          save_delivery_progress(REPO, "release", tag, index + 1, total, fingerprint)
                  clear_delivery_progress()
                  return {
                      "message_ids": collected_ids,
                      "thread_id": None,
                      "content_fingerprint": content_fp,
                      "tag": tag,
                  }

              forum_title_base = f"{PROJECT_NAME} Updated! — {tag}"
              if edited:
                  forum_title_base = f"{PROJECT_NAME} Updated! (edited) — {tag}"
              forum_title = make_forum_title(forum_title_base)
              forum_fingerprint = delivery_fingerprint(messages, title, meta_block, "release")
              progress = None if edited else load_thread_progress()
              thread_id = None
              start_index = 1
              collected_ids = []

              if (
                  not edited
                  and progress
                  and progress.get("repo", REPO) == REPO
                  and progress.get("kind") == "release"
                  and progress.get("item_id") == tag
                  and progress.get("thread_id")
              ):
                  saved_fingerprint = str(progress.get("fingerprint", "")).strip()
                  if saved_fingerprint and saved_fingerprint != forum_fingerprint:
                      print(
                          f"Forum continuation content for {REPO} release {tag} changed; discarding stale thread progress "
                          "and creating a fresh Forum post."
                      )
                      clear_thread_progress()
                      progress = None
                  else:
                      thread_id = str(progress["thread_id"])
                      try:
                          start_index = int(progress.get("next_part", 1))
                      except (TypeError, ValueError):
                          start_index = 1
                      if start_index < 1 or start_index > total + 1:
                          print("Invalid saved continuation position; starting a new Forum post.")
                          thread_id = None
                          start_index = 1
                      else:
                          print(f"Resuming Forum post {thread_id} for release {tag} at part {start_index}/{total}.")

              if not edited and progress and (
                  progress.get("repo", REPO) != REPO
                  or progress.get("kind") != "release"
                  or progress.get("item_id") != tag
              ):
                  print(
                      f"Ignoring stale Forum thread progress (repo={progress.get('repo', 'unknown')}, "
                      f"kind={progress.get('kind', 'unknown')}, item={progress.get('item_id', 'unknown')}) "
                      f"while processing repo={REPO}, item={tag}."
                  )

              for index in range(start_index, total + 1):
                  pieces = messages[index - 1]
                  components, mentions = _build_release_part_components(
                      index, total, pieces, title, meta_block, notes_heading, ping_text, ping_mentions
                  )

                  if index == 1 and thread_id is None:
                      response = send_discord(components, mentions, thread_name=forum_title, applied_tags=applied_tags)
                      thread_id = response.get("channel_id")
                      if not thread_id:
                          raise RuntimeError("Discord created the Forum post but did not return its thread/channel ID.")
                      new_id = str(response.get("id") or "").strip()
                      if new_id:
                          collected_ids.append(new_id)
                      if not edited:
                          save_thread_progress(REPO, "release", tag, thread_id, 2, total, forum_title, forum_fingerprint)
                  else:
                      try:
                          response = send_discord(components, mentions, thread_id=thread_id)
                          new_id = str(response.get("id") or "").strip()
                          if new_id:
                              collected_ids.append(new_id)
                      except DiscordThreadGoneError:
                          thread_id = send_forum_part(
                              components, mentions, index, total, forum_title, "release", tag, thread_id, applied_tags
                          )
                      else:
                          if not edited:
                              save_thread_progress(
                                  REPO, "release", tag, thread_id, index + 1, total, forum_title, forum_fingerprint
                              )
                          continue
                      if not edited:
                          save_thread_progress(
                              REPO, "release", tag, thread_id, index + 1, total, forum_title, forum_fingerprint
                          )

              clear_thread_progress()
              return {
                  "message_ids": collected_ids,
                  "thread_id": str(thread_id) if thread_id else None,
                  "content_fingerprint": content_fp,
                  "tag": tag,
              }
          
          
          def monitor_releases(config):
              configure_repository(config, "release")
              ping_sent = False
              applied_tag_ids = config["tags"] if CURRENT_REPO_TYPE == "forum" else []
              if applied_tag_ids:
                  print(f"Forum tags configured for {REPO}: {', '.join(applied_tag_ids)}")
          
              etag, last_modified = load_etag_state(REPO, "release")
              try:
                  releases = get_recent_releases(etag=etag, last_modified=last_modified)
              except GitHubNotModified:
                  _clear_incompatible_progress(set())
                  print(f"Releases for {REPO} unchanged (HTTP 304).")
                  return {
                      "notifications": 0,
                      "forum_posts": 0,
                      "new_releases": 0,
                      "last_seen_release": None,
                      "last_detected_release": None,
                  }
              if not releases:
                  _clear_incompatible_progress(set())
                  print(f"No published releases found for {REPO}.")
                  return {"notifications": 0, "forum_posts": 0, "new_releases": 0, "last_seen_release": None, "last_detected_release": None}
          
              latest_release = releases[0]
              latest_tag = latest_release.get("tag_name", "").strip()
              old_tag = STATE.read_text().strip() if STATE.exists() else ""
              current_fingerprint = release_content_fingerprint(latest_release)
              notify_state = load_release_notify_state(REPO)
              webhook_fp = _webhook_fingerprint()

              def _seen_release_payload(release_obj):
                  return {
                      "tag": release_obj.get("tag_name"),
                      "url": release_obj.get("html_url"),
                      "published_at_epoch": _iso_to_epoch(release_obj.get("published_at")),
                      "created_at_epoch": _iso_to_epoch(release_obj.get("created_at")),
                  }

              if latest_tag == old_tag:
                  _clear_incompatible_progress(set())
                  stored_tag = str(notify_state.get("tag") or "").strip()
                  stored_fp = str(notify_state.get("fingerprint") or "").strip()

                  if stored_tag != latest_tag or not stored_fp:
                      keep_ids = (
                          notify_state.get("message_ids") or []
                          if stored_tag == latest_tag
                          else []
                      )
                      keep_thread = (
                          notify_state.get("thread_id")
                          if stored_tag == latest_tag
                          else None
                      )
                      save_release_notify_state(
                          REPO,
                          latest_tag,
                          current_fingerprint,
                          message_ids=keep_ids,
                          thread_id=keep_thread,
                          webhook_fingerprint=webhook_fp,
                      )
                      print(
                          f"Recorded release content fingerprint for {REPO} {latest_tag} "
                          "(no edit notification; baseline established for latest release only)."
                      )
                      return {
                          "notifications": 0,
                          "forum_posts": 0,
                          "new_releases": 0,
                          "last_seen_release": _seen_release_payload(latest_release),
                          "last_detected_release": None,
                      }

                  if stored_fp == current_fingerprint:
                      return {
                          "notifications": 0,
                          "forum_posts": 0,
                          "new_releases": 0,
                          "last_seen_release": _seen_release_payload(latest_release),
                          "last_detected_release": None,
                      }

                  print(
                      f"Latest release {latest_tag} for {REPO} was edited on GitHub "
                      "(body and/or assets changed); updating the Discord notification."
                  )
                  prior_ids = []
                  prior_thread = None
                  if str(notify_state.get("webhook_fingerprint") or "") == webhook_fp:
                      prior_ids = notify_state.get("message_ids") or []
                      prior_thread = notify_state.get("thread_id")
                  else:
                      print(
                          f"Webhook changed since the original {REPO} {latest_tag} notification; "
                          "posting a fresh edited-release message instead of editing in place."
                      )

                  delivery = send_release(
                      latest_release,
                      ping=True,
                      note=None,
                      applied_tags=applied_tag_ids,
                      ping_mode=config["ping_mode"],
                      ping_id=config["ping_id"],
                      edited=True,
                      prior_message_ids=prior_ids,
                      prior_thread_id=prior_thread,
                  )
                  save_release_notify_state(
                      REPO,
                      delivery.get("tag") or latest_tag,
                      delivery.get("content_fingerprint") or current_fingerprint,
                      message_ids=delivery.get("message_ids") or [],
                      thread_id=delivery.get("thread_id"),
                      webhook_fingerprint=webhook_fp,
                  )
                  return {
                      "notifications": 1,
                      "forum_posts": 1 if CURRENT_REPO_TYPE == "forum" else 0,
                      "new_releases": 0,
                      "last_seen_release": _seen_release_payload(latest_release),
                      "last_detected_release": _seen_release_payload(latest_release),
                  }

              STATE.parent.mkdir(parents=True, exist_ok=True)

              if not old_tag:
                  if not NOTIFY_ON_INITIAL_RUN:
                      _clear_incompatible_progress(set())
                      STATE.write_text(latest_tag + "\n")
                      save_release_notify_state(
                          REPO,
                          latest_tag,
                          current_fingerprint,
                          message_ids=[],
                          thread_id=None,
                          webhook_fingerprint=webhook_fp,
                      )
                      print(f"First run for {REPO}: recording the latest release without sending a notification.")
                      return {
                          "notifications": 0,
                          "forum_posts": 0,
                          "new_releases": 0,
                          "last_seen_release": _seen_release_payload(latest_release),
                          "last_detected_release": None,
                      }
                  new_releases = [releases[0]]
                  gap = False
              else:
                  tag_index = {r.get("tag_name", "").strip(): i for i, r in enumerate(releases)}
                  if old_tag in tag_index:
                      new_releases = releases[:tag_index[old_tag]]
                      new_releases.reverse()
                      gap = False
                  else:
                      new_releases = [releases[0]]
                      gap = True

              total_new_releases = len(new_releases)
              all_detected_releases = list(new_releases)
              overflow = 0
              if len(new_releases) > MAX_RELEASES_PER_RUN:
                  overflow = len(new_releases) - MAX_RELEASES_PER_RUN
                  new_releases = new_releases[-MAX_RELEASES_PER_RUN:]

              selected_release_ids = {r.get("tag_name", "").strip() for r in new_releases}
              _clear_incompatible_progress(selected_release_ids)

              print(
                  f"New releases to report for {REPO}: {len(new_releases)}"
                  + (f", {overflow} more not shown individually" if overflow else "")
                  + (", gap detected (older release not found in history)" if gap else "")
              )

              note = None
              if gap:
                  note = "_Could not find the last-seen release in recent history - showing the latest release only._"
              elif overflow:
                  note = f"_{overflow} earlier release(s) in this batch were not posted individually._"

              last_delivery = None
              last_release_obj = None
              for i, release in enumerate(new_releases):
                  should_ping = not ping_sent
                  last_delivery = send_release(
                      release,
                      ping=should_ping,
                      note=(note if i == 0 else None),
                      applied_tags=applied_tag_ids,
                      ping_mode=config["ping_mode"],
                      ping_id=config["ping_id"],
                  )
                  last_release_obj = release
                  if should_ping:
                      ping_sent = True
                  release_tag = release.get("tag_name", "").strip()
                  STATE.write_text(release_tag + "\n")

              if last_delivery and last_release_obj is not None:
                  newest_tag = last_delivery.get("tag") or last_release_obj.get("tag_name", "").strip()
                  save_release_notify_state(
                      REPO,
                      newest_tag,
                      last_delivery.get("content_fingerprint")
                      or release_content_fingerprint(last_release_obj),
                      message_ids=last_delivery.get("message_ids") or [],
                      thread_id=last_delivery.get("thread_id"),
                      webhook_fingerprint=webhook_fp,
                  )
                  print(
                      f"Tracking edited-release state for latest release only: {REPO} {newest_tag}."
                  )

              detected_release = all_detected_releases[-1] if all_detected_releases else latest_release
              return {
                  "notifications": len(new_releases),
                  "forum_posts": len(new_releases) if CURRENT_REPO_TYPE == "forum" else 0,
                  "new_releases": total_new_releases,
                  "last_seen_release": _seen_release_payload(latest_release),
                  "last_detected_release": _seen_release_payload(detected_release),
              }
          
          
          def _commit_stats_entry(commit):
              """Build the stats payload for a commit, including any version found in the message."""
              if not commit:
                  return None
              raw_message = (commit.get("commit") or {}).get("message", "") or ""
              first_line = raw_message.splitlines()[0][:200] if raw_message else ""
              analysis = commit.get("_update_analysis")
              version = ""
              if isinstance(analysis, dict):
                  version = str(analysis.get("version") or "").strip()
              if not version or version.lower() == "unknown":
                  version = extract_update_version(raw_message)
              if version and version.lower() == "unknown":
                  version = ""
              return {
                  "sha": commit.get("sha"),
                  "url": commit.get("html_url"),
                  "message": first_line,
                  "version": version,
                  "committed_at_epoch": _iso_to_epoch((commit.get("commit") or {}).get("author", {}).get("date")),
              }


          def monitor_commits(config):
              configure_repository(config, "commit")
              ping_sent = False
              applied_tag_ids = config["tags"] if CURRENT_REPO_TYPE == "forum" else []
              if applied_tag_ids:
                  print(f"Forum tags configured for {REPO}: {', '.join(applied_tag_ids)}")
          
              etag, last_modified = load_etag_state(REPO, "commit")
              try:
                  commits = get_recent_commits(
                      max_pages=1, etag=etag, last_modified=last_modified
                  )
              except GitHubNotModified:
                  _clear_incompatible_progress(set())
                  print(f"Commits for {REPO} unchanged (HTTP 304).")
                  return {
                      "notifications": 0,
                      "forum_posts": 0,
                      "new_commits": 0,
                      "last_seen_commit": None,
                      "last_detected_commit": None,
                  }
              if not commits:
                  _clear_incompatible_progress(set())
                  print(f"No commits found for {REPO}.")
                  return {"notifications": 0, "forum_posts": 0, "new_commits": 0, "last_seen_commit": None, "last_detected_commit": None}
          
              latest_commit = commits[0]
              latest_sha = latest_commit["sha"]
              old_sha = STATE.read_text().strip() if STATE.exists() else ""
          
              if latest_sha == old_sha:
                  _clear_incompatible_progress(set())
                  return {
                      "notifications": 0,
                      "forum_posts": 0,
                      "new_commits": 0,
                      "last_seen_commit": _commit_stats_entry(latest_commit),
                      "last_detected_commit": None,
                  }
          
              STATE.parent.mkdir(parents=True, exist_ok=True)
          
              if not old_sha:
                  if not NOTIFY_ON_INITIAL_RUN:
                      _clear_incompatible_progress(set())
                      STATE.write_text(latest_sha + "\n")
                      print(f"First run for {REPO}: recording the latest commit without sending a notification.")
                      return {
                          "notifications": 0,
                          "forum_posts": 0,
                          "new_commits": 0,
                          "last_seen_commit": _commit_stats_entry(latest_commit),
                          "last_detected_commit": None,
                      }
                  raw_new_commits = [commits[0]]
                  gap = False
              else:
                  sha_index = {c["sha"]: i for i, c in enumerate(commits)}
                  if old_sha in sha_index:
                      raw_new_commits = commits[:sha_index[old_sha]]
                      raw_new_commits.reverse()
                      gap = False
                  else:
                      raw_new_commits = [commits[0]]
                      gap = True
          
              eligible_commits = []
              for commit in raw_new_commits:
                  analysis = analyze_commit(commit)
                  if analysis:
                      commit["_update_analysis"] = analysis
                      eligible_commits.append(commit)
              filtered_count = len(raw_new_commits) - len(eligible_commits)
          
              note = None
              if gap:
                  note = "_Could not find the last-seen commit in recent history - showing the latest commit only._"
          
              if not eligible_commits:
                  _clear_incompatible_progress(set())
                  STATE.write_text(latest_sha + "\n")
                  print(f"No commits matched the configured filters for {REPO}; advanced state past {len(raw_new_commits)} new commit(s).")
                  return {
                      "notifications": 0,
                      "forum_posts": 0,
                      "new_commits": 0,
                      "last_seen_commit": _commit_stats_entry(latest_commit),
                      "last_detected_commit": None,
                  }

              total_new_commits = len(eligible_commits)
              all_detected_commits = list(eligible_commits)
              overflow = 0
              if len(eligible_commits) > MAX_COMMITS_PER_RUN:
                  overflow = len(eligible_commits) - MAX_COMMITS_PER_RUN
                  eligible_commits = eligible_commits[-MAX_COMMITS_PER_RUN:]
          
              selected_commit_ids = {c["sha"] for c in eligible_commits}
              _clear_incompatible_progress(selected_commit_ids)
          
              if overflow:
                  overflow_note = f"_{overflow} earlier matching commit(s) in this batch were not posted individually._"
                  note = f"{note}\n\n{overflow_note}" if note else overflow_note
              if filtered_count:
                  filter_note = f"_{filtered_count} commit(s) were ignored as non-update noise._"
                  note = f"{note}\n\n{filter_note}" if note else filter_note
          
              for i, commit in enumerate(eligible_commits):
                  should_ping = not ping_sent
                  send_commit(
                      commit,
                      ping=should_ping,
                      note=(note if i == 0 else None),
                      applied_tags=applied_tag_ids,
                      ping_mode=config["ping_mode"],
                      ping_id=config["ping_id"],
                  )
                  if should_ping:
                      ping_sent = True
                  STATE.write_text(commit["sha"] + "\n")
          
              STATE.write_text(latest_sha + "\n")
              detected_commit = all_detected_commits[-1] if all_detected_commits else latest_commit
              return {
                  "notifications": len(eligible_commits),
                  "forum_posts": len(eligible_commits) if CURRENT_REPO_TYPE == "forum" else 0,
                  "new_commits": total_new_commits,
                  "last_seen_commit": _commit_stats_entry(latest_commit),
                  "last_detected_commit": _commit_stats_entry(detected_commit),
              }
          
          def main():
              event_name = os.environ.get("GITHUB_EVENT_NAME", "")
              validation_only = event_name in {"push", "pull_request"}
              print(
                  f"Event: {event_name or 'unknown'} | "
                  f"mode: {'VALIDATION ONLY' if validation_only else 'LIVE MONITOR'} | "
                  f"config: {CONFIG_FILE}"
              )

              try:
                  configs = parse_repositories(REPOS_RAW)
              except Exception as config_error:
                  print(f"::error::Repository config validation failed: {config_error}")
                  raise

              print(f"Config validation passed: {len(configs)} repository block(s) are valid.")
              for config in configs:
                  enabled_label = "enabled" if config.get("enabled", True) else "disabled"
                  print(
                      f"- {config['repo']} | type={config['repo_type']} | "
                      f"monitor={config['monitor_type']} | ping={config['ping_mode']} | {enabled_label}"
                  )

              if validation_only:
                  print(
                      "Validation-only run complete. "
                      "Config and workflow parse succeeded; skipping GitHub checks, "
                      "Discord notifications, and state updates."
                  )
                  print("::notice::Repo Monitor config validation succeeded.")
                  return

              stats_state = load_stats_state() if STATS_ENABLED else None

              active_configs = [config for config in configs if config.get("enabled", True)]
              disabled_configs = [config for config in configs if not config.get("enabled", True)]
              if disabled_configs:
                  print(
                      f"Skipping {len(disabled_configs)} disabled repositor"
                      f"{'y' if len(disabled_configs) == 1 else 'ies'}: "
                      + ", ".join(config["repo"] for config in disabled_configs)
                  )

              if stats_state is not None:
                  _record_stats_run_start(stats_state, len(active_configs))
                  _stats_prune_removed_repos(
                      stats_state, [config["repo"] for config in configs]
                  )
                  for config in configs:
                      repo_state = _stats_repo_state(stats_state, config["repo"])
                      repo_state["monitor_kinds"] = []
                      _stats_set_monitor_kinds(repo_state, config.get("monitor_type"))
                      if not config.get("enabled", True):
                          repo_state["last_status"] = "Disabled"

              had_error = False
              github_rate_limit_blocked = False

              def _prefetch_github_feed(config, kind):
                  """Fetch one repo feed early so multiple repos overlap on the network."""
                  repo = config["repo"]
                  api_base = config["github_api_base_url"]
                  if kind == "commit":
                      url = f"{api_base}/repos/{repo}/commits?per_page=100"
                      etag_kind = "commit"
                  else:
                      url = f"{api_base}/repos/{repo}/releases?per_page=30"
                      etag_kind = "release"
                  etag, last_modified = load_etag_state(repo, etag_kind)
                  try:
                      def build_request(
                          request_url=url,
                          request_etag=etag,
                          request_last_modified=last_modified,
                      ):
                          return urllib.request.Request(
                              request_url,
                              headers=_github_request_headers(
                                  request_etag, request_last_modified
                              ),
                          )

                      body, resp_headers = fetch_with_retry(
                          build_request, service="github", return_headers=True
                      )
                      new_etag = _header_value(resp_headers, "ETag") or etag
                      new_last_modified = (
                          _header_value(resp_headers, "Last-Modified") or last_modified
                      )
                      data = json.loads(body)
                      if kind == "release":
                          data = [
                              release
                              for release in data
                              if not release.get("draft")
                              and not release.get("prerelease")
                              and str(release.get("tag_name") or "").strip()
                          ]
                      return (repo, kind, "ok", data, new_etag, new_last_modified)
                  except GitHubNotModified:
                      return (repo, kind, "not_modified", None, etag, last_modified)
                  except Exception as error:
                      return (repo, kind, "error", error, None, None)

              prefetch_tasks = []
              for config in active_configs:
                  if config["monitor_type"] == "commits":
                      prefetch_tasks.append((config, "commit"))
                  if config["monitor_type"] == "releases":
                      prefetch_tasks.append((config, "release"))

              PREFETCH_CACHE.clear()
              if prefetch_tasks:
                  workers = max(1, min(MAX_GITHUB_PREFETCH_WORKERS, len(prefetch_tasks)))
                  print(
                      f"Prefetching {len(prefetch_tasks)} GitHub feed(s) "
                      f"with up to {workers} worker(s)..."
                  )
                  with ThreadPoolExecutor(max_workers=workers) as executor:
                      futures = [
                          executor.submit(_prefetch_github_feed, config, kind)
                          for config, kind in prefetch_tasks
                      ]
                      for future in as_completed(futures):
                          repo, kind, status, payload, new_etag, new_lm = future.result()
                          if status == "ok":
                              PREFETCH_CACHE[(repo, kind)] = (
                                  "ok",
                                  payload,
                                  new_etag,
                                  new_lm,
                              )
                          elif status == "not_modified":
                              PREFETCH_CACHE[(repo, kind)] = ("not_modified",)
                              print(f"Prefetch {repo} {kind}: HTTP 304 Not Modified")
                          else:
                              PREFETCH_CACHE[(repo, kind)] = ("error", payload)
                              print(f"Prefetch {repo} {kind} failed: {payload}")

              for config in active_configs:
                  if github_rate_limit_blocked:
                      print(f"Skipping {config['repo']} because the GitHub primary rate limit already blocked this run.")
                      continue

                  kinds = []
                  if config["monitor_type"] == "commits":
                      kinds.append("commit")
                  if config["monitor_type"] == "releases":
                      kinds.append("release")

                  active_kinds = {"commits" if kind == "commit" else "releases" for kind in kinds}
                  permanent_path = permanent_failure_state_path_for_repo(config["repo"])
                  permanent_state = _load_json_state(permanent_path)
                  if permanent_state:
                      failed_kinds = set(permanent_state.get("failed_kinds", [])) & active_kinds
                      if failed_kinds:
                          permanent_state["failed_kinds"] = sorted(failed_kinds)
                          _save_json_state(permanent_path, permanent_state)
                      else:
                          _clear_json_state(permanent_path)

                  for inactive_kind in {"commits", "releases"} - active_kinds:
                      _clear_json_state(failure_state_path_for_repo(config["repo"], inactive_kind))

                  for kind in kinds:
                      monitor_config = dict(config)
                      monitor_config["monitor_type"] = "commits" if kind == "commit" else "releases"
                      try:
                          if kind == "commit":
                              result = monitor_commits(monitor_config)
                          else:
                              result = monitor_releases(monitor_config)
                          record_repo_success(monitor_config)
                          if stats_state is not None:
                              _record_stats_repo_result(stats_state, monitor_config, result)
                      except GitHubRateLimitError as error:
                          had_error = True
                          github_rate_limit_blocked = True
                          record_global_rate_limit_failure(monitor_config, error.reset_epoch)
                          if stats_state is not None:
                              _record_stats_rate_limit(stats_state, monitor_config, error.reset_epoch)
                          print(
                              f"GitHub primary rate limit exhausted while checking {config['repo']}; "
                              "skipping the remaining repositories for this run."
                          )
                          break
                      except GitHubPermanentError as error:
                          had_error = True
                          record_repo_failure(monitor_config, error, permanent=True)
                          if stats_state is not None:
                              _record_stats_error(stats_state, monitor_config, error)
                          print(f"Permanent GitHub error while monitoring {config['repo']}: {error}")
                      except DiscordPermanentError as error:
                          had_error = True
                          record_repo_failure(monitor_config, error, permanent=True)
                          if stats_state is not None:
                              _record_stats_error(stats_state, monitor_config, error)
                          print(f"Permanent Discord error while monitoring {config['repo']}: {error}")
                      except Exception as error:
                          had_error = True
                          record_repo_failure(monitor_config, error, permanent=False)
                          if stats_state is not None:
                              _record_stats_error(stats_state, monitor_config, error)
                          print(f"Error while monitoring {kind}s for {config['repo']}: {error}")

              if not github_rate_limit_blocked:
                  record_global_rate_limit_success()

              if stats_state is not None:
                  finalize_stats_dashboard(stats_state)

              if had_error:
                  raise SystemExit(1)


          def _record_stats_fatal_error(state, message):
              """Bump error counters when the run dies outside per-repo handlers."""
              if state is None:
                  return
              # Open a this-run window for error counts, but do not push Next check out —
              # error-driven stats edits must keep the existing schedule countdown.
              repos_total = 0
              try:
                  repos_total = int((state.get("current") or {}).get("repos_total", 0) or 0)
              except (TypeError, ValueError):
                  repos_total = 0
              _record_stats_run_start(state, repos_total, reset_schedule=False)
              now = _now_epoch()
              state["current"]["errors"] = _coerce_nonneg_int(state["current"].get("errors")) + 1
              _bump_lifetime_errors(state, 1)
              error_info = {
                  "repo": None,
                  "kind": None,
                  "message": str(message)[:500],
                  "timestamp": now,
              }
              state["current"]["last_error"] = error_info
              state["last_known"]["last_error"] = error_info
              save_stats_state(state)
              print(
                  f"Recorded fatal stats error "
                  f"(lifetime errors now {state['lifetime']['errors']}; "
                  f"next_check preserved={state['current'].get('next_check')})."
              )
              send_incident_log(
                  "fatal",
                  str(message),
                  repo=None,
                  details={"Scope": "workflow"},
              )


          try:
              main()
          except SystemExit:
              raise
          except Exception as error:
              print(f"Fatal monitor error: {error}")
              if STATS_ENABLED:
                  try:
                      fatal_stats = load_stats_state()
                      _record_stats_fatal_error(fatal_stats, error)
                      finalize_stats_dashboard(fatal_stats)
                  except Exception as stats_error:
                      print(f"Could not update stats dashboard after fatal error: {stats_error}")
              raise
          PY

      # Persist on every event (not only workflow_dispatch). Config errors on push/PR
      # update the stats dashboard in the workspace; without these steps the next cron
      # run reloads the old counter from git and rolls Lifetime Errors backward.
      - name: Save stats dashboard message cache
        if: ${{ !cancelled() && (success() || failure()) }}
        uses: actions/cache/save@v4
        with:
          path: .github/monitor-state/_stats.cache.json
          key: repo-monitor-stats-msg-${{ github.run_id }}-${{ github.run_attempt }}


      - name: Save monitor state
        if: ${{ !cancelled() && (success() || failure()) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_TERMINAL_PROMPT=0
          export GIT_EDITOR=true

          if [ ! -d "$STATE_DIR" ]; then
            echo "No state directory; nothing to save."
            exit 0
          fi
          find "$STATE_DIR" -type f -name '*.tmp' -delete

          # Show durable error counter before commit so logs prove what is being saved.
          if [ -f "$STATE_DIR/_stats.json" ]; then
            echo "Stats lifetime errors in workspace:"
            python3 -c "import json; d=json.load(open('$STATE_DIR/_stats.json')); print(d.get('lifetime',{}).get('errors'), d.get('last_known',{}).get('lifetime_errors_high_water'))" 2>/dev/null || true
          fi
          if [ -f "$STATE_DIR/_lifetime.json" ]; then
            echo "Lifetime file contents:"
            cat "$STATE_DIR/_lifetime.json" || true
          fi

          STATE_SNAPSHOT="$(mktemp -d)"
          cp -a "$STATE_DIR/." "$STATE_SNAPSHOT/"

          for attempt in 1 2 3 4 5; do
            echo "State push attempt $attempt/5..."
            git fetch origin "${GITHUB_REF_NAME}"

            git reset --hard "origin/${GITHUB_REF_NAME}"

            rm -rf "$STATE_DIR"
            mkdir -p "$STATE_DIR"
            cp -a "$STATE_SNAPSHOT/." "$STATE_DIR/"

            git add -A -- "$STATE_DIR"
            git reset HEAD -- "$STATE_DIR/_stats.cache.json" "$STATE_DIR/_stats.cache.json.tmp" 2>/dev/null || true
            rm -f "$STATE_DIR/_stats.cache.json.tmp"

            if git diff --cached --quiet; then
              echo "No state changes to commit relative to origin/${GITHUB_REF_NAME}."
              rm -rf "$STATE_SNAPSHOT"
              exit 0
            fi

            git commit -m "Update monitor state ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "State pushed successfully."
              rm -rf "$STATE_SNAPSHOT"
              exit 0
            fi

            echo "Push attempt $attempt/5 lost a race; retrying..."
            sleep $((attempt * 3))
          done

          rm -rf "$STATE_SNAPSHOT"
          echo "::error::Failed to push state update after multiple attempts."
          exit 1

