# ============================================================================
# Repo Release Monitor — TEMPLATE
#
# Posts a Discord notification whenever a new GitHub Release goes out on a
# repo of your choosing. See README.md for setup instructions.
# ============================================================================

name: Repo Release Monitor   

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-release-monitor    
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONFIG_FILE: "config/repos.yml"              # Shared repository and ping configuration.
      STATE_DIR: ".github/monitor-state"           # <-- CHANGE THIS if you want the monitor state stored somewhere else.
      NOTIFY_ON_INITIAL_RUN: "true"                # set to "false" to silently record the current latest item on first run instead of posting/pinging about it


    steps:
      - name: Checkout monitor state
        uses: actions/checkout@v4

      - name: Calculate 59-day inactivity reminder state
        id: inactivity
        shell: bash
        run: |                                   # GitHub's 60-day scheduled-workflow inactivity rule is based on activity in the repository that contains this workflow.
          interval=$((59 * 24 * 60 * 60))
          last_commit_epoch="$(git log -1 --format=%ct)"
          last_commit_sha="$(git rev-parse HEAD)"
          now_epoch="$(date -u +%s)"
          elapsed=$((now_epoch - last_commit_epoch))
          cycle=$((elapsed / interval))

          if [ "$elapsed" -ge "$interval" ]; then
            eligible="true"
          else
            eligible="false"
          fi

          workflow_key="$(printf '%s' "${GITHUB_WORKFLOW_REF:-$GITHUB_WORKFLOW}" | sha256sum | cut -c1-16)"

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "cache_key=github-workflow-inactivity-${workflow_key}-${last_commit_sha}-${cycle}" >> "$GITHUB_OUTPUT"

      - name: Restore 59-day inactivity reminder state
        id: inactivity-cache
        uses: actions/cache/restore@v4
        with:
          path: .github/.workflow-inactivity-reminder.marker
          key: ${{ steps.inactivity.outputs.cache_key }}

      - name: Check for new releases
        id: monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMINDER_ELIGIBLE: ${{ steps.inactivity.outputs.eligible }}
          REMINDER_CACHE_HIT: ${{ steps.inactivity-cache.outputs.cache-hit }}
          REMINDER_CACHE_MARKER: .github/.workflow-inactivity-reminder.marker
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path

          CONFIG_FILE = Path(os.environ.get("CONFIG_FILE", "config/repos.yml"))
          STATE_DIR = Path(os.environ.get("STATE_DIR", ".github/monitor-state"))
          REPO = ""
          PROJECT_NAME = ""
          API_URL = ""

          WEBHOOK = os.environ["DISCORD_WEBHOOK"]
          GITHUB_TOKEN = os.environ.get("GITHUB_TOKEN", "")
          NOTIFY_ON_INITIAL_RUN = os.environ.get("NOTIFY_ON_INITIAL_RUN", "true").strip().lower() not in ("false", "0", "no")

          STATE = None

          # Stay comfortably under Discord's per-message limits (~4000 total text chars, 40 components).
          TOTAL_MESSAGE_BUDGET = 3800
          MAX_TOTAL_COMPONENTS = 36
          FIRST_FIXED_COMPONENTS = 6         # ping, container, title, sep, meta, sep
          CONTINUATION_FIXED_COMPONENTS = 1  # container
          CONTINUATION_LABEL_OVERHEAD = 80  # room for "(continued) - Part X/Y:" labels
          MIN_CHUNK = 200  # floor so an unusually long header never stalls chunking
          MAX_RELEASES_PER_RUN = 10  # cap so a bulk-import of releases can't flood the channel
          RETRY_ATTEMPTS = 3          # attempts for plain network errors (timeouts, DNS, etc.)
          RETRY_BACKOFF_SECONDS = 3
          RATE_LIMIT_RETRY_ATTEMPTS = 5   # attempts specifically for HTTP 429 (rate limited)
          RATE_LIMIT_MAX_WAIT_SECONDS = 15  # cap per-wait even if Retry-After asks for longer
          DISCORD_SEND_DELAY_SECONDS = 0.5  # minimum gap between consecutive Discord messages




          def strip_config_value(raw_value):
              """Strip a trailing '# comment' from a config value. A value that
              starts with a quote is taken verbatim up to its matching closing
              quote, so a quoted value is never truncated by a '#' inside it."""
              value = raw_value.strip()
              if value[:1] in ('"', "'"):
                  quote = value[0]
                  closing = value.find(quote, 1)
                  if closing != -1:
                      return value[1:closing]
                  return value[1:].strip()
              hash_index = value.find("#")
              if hash_index != -1:
                  value = value[:hash_index]
              return value.strip()


          def load_config(path):
              """Load ping defaults and the repository section from config/repos.yml."""
              if not path.is_file():
                  raise FileNotFoundError(
                      f"Config file not found: {path}. Create config/repos.yml with ping_mode, ping_id, and repos."
                  )

              text = path.read_text(encoding="utf-8")
              allowed_top_level_keys = {"ping_mode", "ping_id", "repos"}
              top_level = {}
              repo_lines = []
              in_repos = False
              repos_indent = None

              for line_number, raw_line in enumerate(text.splitlines(), start=1):
                  if not raw_line.strip() or raw_line.lstrip().startswith("#"):
                      if in_repos:
                          repo_lines.append(raw_line)
                      continue

                  indent = len(raw_line) - len(raw_line.lstrip())
                  stripped = raw_line.strip()

                  if indent == 0:
                      in_repos = False
                      repos_indent = None
                      if ":" not in stripped:
                          raise ValueError(
                              f"Invalid config on line {line_number}: {stripped!r}. Expected 'key: value'."
                          )
                      key, value = stripped.split(":", 1)
                      key = key.strip()
                      value = strip_config_value(value)
                      if key not in allowed_top_level_keys:
                          raise ValueError(
                              f"Unknown config setting on line {line_number}: {key!r}. "
                              f"Use: {', '.join(sorted(allowed_top_level_keys))}."
                          )
                      if key == "repos":
                          if value:
                              raise ValueError(
                                  f"Invalid 'repos' setting on line {line_number}: the value must contain the repository blocks below it."
                              )
                          in_repos = True
                          top_level[key] = True
                      else:
                          top_level[key] = value
                      continue

                  if not in_repos:
                      raise ValueError(
                          f"Invalid config on line {line_number}: indented settings must be inside the 'repos:' section."
                      )

                  if repos_indent is None:
                      repos_indent = indent
                  if indent < repos_indent:
                      raise ValueError(
                          f"Invalid config indentation on line {line_number}: repository settings must stay inside 'repos:'."
                      )
                  repo_lines.append(raw_line[repos_indent:])

              if not top_level.get("repos"):
                  raise ValueError("Config is missing the 'repos:' section.")

              ping_mode = str(top_level.get("ping_mode", "user")).strip().lower()
              ping_id = str(top_level.get("ping_id", "")).strip()
              return ping_mode, ping_id, "\n".join(repo_lines).strip()

          DEFAULT_PING_MODE, DEFAULT_PING_ID, REPOS_RAW = load_config(CONFIG_FILE)

          VALID_PING_MODES = {"user", "role", "everyone", "none"}
          if DEFAULT_PING_MODE not in VALID_PING_MODES:
              raise ValueError(
                  f"Invalid ping_mode in config: {DEFAULT_PING_MODE!r}. Use user, role, everyone, or none."
              )
          if DEFAULT_PING_MODE in {"user", "role"} and not DEFAULT_PING_ID:
              raise ValueError(
                  f"ping_mode is {DEFAULT_PING_MODE!r} but ping_id is empty. "
                  "Set ping_id in config/repos.yml, or change ping_mode to everyone/none."
              )


          def parse_repositories(raw):
              """Parse one small YAML-style block per repository.

              Supported fields:
                - repo: OWNER/REPO
                  type: normal|forum
                  ping: user|role|everyone|none
                  ping_id: DISCORD_USER_OR_ROLE_ID
                  tags:
                    - FORUM_TAG_ID

              The type field is required and must be either normal or forum.
              The per-repository ping and ping_id fields are optional. Missing ping settings
              inherit the global ping_mode/ping_id from config/repos.yml.
              Forum tags are only used by Forum-channel workflows.
              """
              repositories = []
              valid_ping_modes = {"user", "role", "everyone", "none"}
              allowed_keys = {"repo", "type", "ping", "ping_id", "tags"}
              configs = []
              current = None
              current_list_key = None

              for line_number, raw_line in enumerate(raw.splitlines(), start=1):
                  if not raw_line.strip() or raw_line.lstrip().startswith("#"):
                      continue

                  indent = len(raw_line) - len(raw_line.lstrip())
                  line = raw_line.strip()

                  if line.startswith("- ") and indent == 0:
                      if current is not None:
                          configs.append(current)
                      current = {}
                      current_list_key = None
                      entry = line[2:].strip()
                      if ":" not in entry:
                          raise ValueError(
                              f"Invalid repository entry on line {line_number}: {line!r}. "
                              "Each repository must start with '- repo: OWNER/REPO'."
                          )
                      key, value = entry.split(":", 1)
                      key = key.strip()
                      value = strip_config_value(value)
                      if key != "repo":
                          raise ValueError(
                              f"Invalid repository entry on line {line_number}: "
                              "the first field in each repository block must be 'repo'."
                          )
                      current[key] = value
                      continue

                  if current is None:
                      raise ValueError(
                          f"Invalid repository configuration on line {line_number}: "
                          "repository settings must be inside a '- repo:' block."
                      )

                  if line.startswith("- ") and indent > 0:
                      if current_list_key != "tags" or "tags" not in current:
                          raise ValueError(
                              f"Invalid list item on line {line_number}: only 'tags' may contain list items."
                          )
                      current["tags"].append(line[2:].strip().strip('"').strip("'"))
                      continue

                  if ":" not in line:
                      raise ValueError(
                          f"Invalid repository setting on line {line_number}: {line!r}. "
                          "Expected 'key: value'."
                      )

                  key, value = line.split(":", 1)
                  key = key.strip()
                  value = strip_config_value(value)
                  if key not in allowed_keys:
                      raise ValueError(
                          f"Unknown repository setting on line {line_number}: {key!r}. "
                          f"Use: {', '.join(sorted(allowed_keys))}."
                      )
                  if key == "tags":
                      if value:
                          current["tags"] = [tag.strip() for tag in value.split(",") if tag.strip()]
                      else:
                          current["tags"] = []
                      current_list_key = "tags"
                  else:
                      current[key] = value
                      current_list_key = None

              if current is not None:
                  configs.append(current)

              for index, config in enumerate(configs, start=1):
                  repo = config.get("repo", "").strip()
                  repo_type = config.get("type", "").strip().lower()
                  project_name = repo.rsplit("/", 1)[-1]
                  per_repo_ping_mode = config.get("ping", "").strip().lower()
                  per_repo_ping_id = config.get("ping_id", "").strip()
                  ping_mode = per_repo_ping_mode or DEFAULT_PING_MODE
                  ping_id = per_repo_ping_id or (DEFAULT_PING_ID if not per_repo_ping_mode else "")

                  if not repo:
                      raise ValueError(
                          f"Repository block {index} is missing 'repo: OWNER/REPO'."
                      )
                  if repo_type not in {"normal", "forum"}:
                      raise ValueError(
                          f"Invalid type in repository block {index}: {repo_type!r}. "
                          "Use 'normal' or 'forum'."
                      )
                  if not re.fullmatch(r"[^/\s]+/[^/\s]+", repo):
                      raise ValueError(
                          f"Invalid repo in repository block {index}: {repo!r}. "
                          "Expected OWNER/REPO."
                      )
                  if ping_mode not in valid_ping_modes:
                      raise ValueError(
                          f"Invalid ping mode in repository block {index}: {ping_mode!r}. "
                          "Use user, role, everyone, or none."
                      )
                  if per_repo_ping_mode and ping_mode in {"user", "role"} and not per_repo_ping_id:
                      raise ValueError(
                          f"Missing 'ping_id' in repository block {index}: "
                          f"a per-repo ping mode of {ping_mode!r} requires a user or role ID."
                      )
                  if per_repo_ping_id and not per_repo_ping_mode and ping_mode not in {"user", "role"}:
                      raise ValueError(
                          f"'ping_id' was set in repository block {index} but the inherited "
                          f"ping mode ({ping_mode!r}) doesn't use one, so it would silently have "
                          "no effect. Add 'ping: user' or 'ping: role' to this block, or remove 'ping_id'."
                      )
                  if ping_mode in {"everyone", "none"}:
                      ping_id = ""

                  repositories.append((repo, project_name, repo_type, ping_mode, ping_id))

              if not repositories:
                  raise ValueError(
                      "The 'repos:' section is empty. Add at least one '- repo: OWNER/REPO' block to config/repos.yml."
                  )

              return repositories

          def state_path_for_repo(repo):
              """Return a filesystem-safe state filename unique to the monitored repo."""
              key = re.sub(r"[^A-Za-z0-9._-]+", "_", repo.replace("/", "__"))
              suffix = "release" if API_URL.startswith("https://api.github.com/repos/") and "/releases" in API_URL else "commit"
              return STATE_DIR / f"{key}_{suffix}.txt"


          def configure_repository(repo, project_name):
              """Set repository-specific API, state, and issue-link context."""
              global REPO, PROJECT_NAME, API_URL, STATE, ISSUE_URL_PATTERN

              REPO = repo
              PROJECT_NAME = project_name
              API_URL = f"https://api.github.com/repos/{REPO}/releases?per_page=30"
              STATE = state_path_for_repo(REPO)
              ISSUE_URL_PATTERN = re.compile(
                  r"(?<!\]\()(?<!\w)https://github\.com/"
                  + re.escape(REPO)
                  + r"/(?:pull|issues)/(\d+)(?=[\s).,]|$)"
              )


          def fetch_with_retry(request_factory):
              """Retry on network errors and HTTP 429; any other HTTPError is raised immediately."""
              last_error = None
              network_attempt = 0
              rate_limit_attempt = 0
              while True:
                  try:
                      req = request_factory()
                      with urllib.request.urlopen(req, timeout=30) as response:
                          return response.read()
                  except urllib.error.HTTPError as error:
                      if error.code == 429 and rate_limit_attempt < RATE_LIMIT_RETRY_ATTEMPTS:
                          rate_limit_attempt += 1
                          retry_after = error.headers.get("Retry-After") if error.headers else None
                          try:
                              wait = float(retry_after)
                          except (TypeError, ValueError):
                              wait = RETRY_BACKOFF_SECONDS * rate_limit_attempt
                          wait = min(max(wait, 0), RATE_LIMIT_MAX_WAIT_SECONDS)
                          print(f"Rate limited (429), waiting {wait:.1f}s before retry "
                                f"({rate_limit_attempt}/{RATE_LIMIT_RETRY_ATTEMPTS})")
                          time.sleep(wait)
                          last_error = error
                          continue
                      raise
                  except (urllib.error.URLError, TimeoutError) as error:
                      network_attempt += 1
                      last_error = error
                      print(f"Attempt {network_attempt}/{RETRY_ATTEMPTS} failed: {error}")
                      if network_attempt < RETRY_ATTEMPTS:
                          time.sleep(RETRY_BACKOFF_SECONDS * network_attempt)
                      else:
                          raise last_error


          def get_recent_releases():
              def build_request():
                  headers = {
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "GitHub-Discord-Monitor/1.0",
                      "X-GitHub-Api-Version": "2022-11-28",
                  }
                  if GITHUB_TOKEN:
                      headers["Authorization"] = f"Bearer {GITHUB_TOKEN}"
                  return urllib.request.Request(API_URL, headers=headers)

              body = fetch_with_retry(build_request)
              releases = json.loads(body)  # newest first
              # Mirror /releases/latest semantics: exclude drafts and prereleases.
              return [r for r in releases if not r.get("draft") and not r.get("prerelease")]


          def build_ping(ping_mode, ping_id):
              """Returns (ping_text, allowed_mentions) for a repository's ping settings."""
              if ping_mode == "user" and ping_id:
                  return f"<@{ping_id}>", {"users": [ping_id]}
              if ping_mode == "role" and ping_id:
                  return f"<@&{ping_id}>", {"roles": [ping_id]}
              if ping_mode == "everyone":
                  return "@everyone", {"parse": ["everyone"]}
              return "", {}


          def maybe_send_inactivity_reminder():
              """Send exactly one reminder per 59-day inactivity cycle and cache that fact."""
              output_path = os.environ.get("GITHUB_OUTPUT")
              if output_path:
                  with open(output_path, "a", encoding="utf-8") as output:
                      output.write("reminder_sent=false\n")

              eligible = os.environ.get("REMINDER_ELIGIBLE", "").strip().lower() == "true"
              cache_hit = os.environ.get("REMINDER_CACHE_HIT", "").strip().lower() == "true"
              if not eligible or cache_hit:
                  return

              ping_text, ping_mentions = build_ping(DEFAULT_PING_MODE, DEFAULT_PING_ID)

              title = "## Workflow Re-enable Reminder"
              body = (
                  "**Action Required:** Re-enable this workflow **the day after this message is sent**.\n\n"
                  "This repository has been inactive for 59 days, and GitHub may automatically disable scheduled workflows after 60 days without repository activity.\n\n"
                  "**Please re-enable this workflow tomorrow to prevent the monitoring system from being disabled.**\n\n"
                  "No action is required today. **The workflow should be re-enabled the day after this reminder is sent.**"
              )

              components = []
              if ping_text:
                  components.append({"type": 10, "content": ping_text})

              container = [
                  {"type": 10, "content": title},
                  {"type": 14, "spacing": 1},
                  {"type": 10, "content": body},
              ]
              components.append({"type": 17, "components": container})

              send_discord(components, ping_mentions)

              marker = Path(os.environ["REMINDER_CACHE_MARKER"])
              marker.parent.mkdir(parents=True, exist_ok=True)
              marker.write_text("reminded\n", encoding="utf-8")

              if output_path:
                  with open(output_path, "a", encoding="utf-8") as output:
                      output.write("reminder_sent=true\n")

          _last_discord_send_at = {"t": None}


          def send_discord(components, allowed_mentions=None):
              # Throttle sends to avoid tripping Discord's rate limit.
              last_sent = _last_discord_send_at["t"]
              if last_sent is not None:
                  elapsed = time.monotonic() - last_sent
                  if elapsed < DISCORD_SEND_DELAY_SECONDS:
                      time.sleep(DISCORD_SEND_DELAY_SECONDS - elapsed)

              separator = "&" if "?" in WEBHOOK else "?"
              url = f"{WEBHOOK}{separator}wait=true&with_components=true"

              payload = {
                  "flags": 32768,  # IS_COMPONENTS_V2
                  "allowed_mentions": allowed_mentions or {},
                  "components": components,
              }
              body = json.dumps(payload).encode("utf-8")

              def build_request():
                  return urllib.request.Request(
                      url,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "User-Agent": "GitHub-Discord-Monitor/1.0",
                      },
                      method="POST",
                  )

              try:
                  fetch_with_retry(build_request)
              except urllib.error.HTTPError as error:
                  error_body = error.read().decode("utf-8", errors="replace")
                  print(f"Discord error HTTP {error.code}: {error_body}")
                  raise
              finally:
                  _last_discord_send_at["t"] = time.monotonic()


          # Convert bare "#123" refs and bare issue/PR URLs into real links (Discord doesn't auto-link either).
          ISSUE_REF_PATTERN = re.compile(r"(?<![\[\w/#])#(\d+)(?!\w)")
          ISSUE_URL_PATTERN = re.compile(r"a^b")  # replaced by configure_repository() before linkification


          def linkify_issue_refs(text):
              text = ISSUE_URL_PATTERN.sub(
                  lambda m: f"[#{m.group(1)}]({m.group(0)})", text
              )
              text = ISSUE_REF_PATTERN.sub(
                  lambda m: f"[#{m.group(1)}](https://github.com/{REPO}/issues/{m.group(1)})",
                  text,
              )
              return text


          def release_meta(release):
              tag = release.get("tag_name", "").strip()
              release_url = release.get("html_url")
              author = (release.get("author") or {}).get("login", "Unknown")
              notes = (release.get("body") or "").strip() or "(No release notes.)"
              notes = linkify_issue_refs(notes)
              return tag, release_url, author, notes


          HEADING_PATTERN = re.compile(r"^#{1,6}\s+\S")


          def is_heading_line(line):
              return bool(HEADING_PATTERN.match(line))


          def split_long_line(line, capacity):
              """Break a line into pieces <= capacity, splitting on whitespace only."""
              if len(line) <= capacity:
                  return [line]
              pieces = []
              remaining = line
              while len(remaining) > capacity:
                  cut = remaining.rfind(" ", 0, capacity + 1)
                  if cut <= 0:
                      cut = capacity
                  pieces.append(remaining[:cut].rstrip())
                  remaining = remaining[cut:].lstrip()
              if remaining:
                  pieces.append(remaining)
              return pieces


          def pack_messages(text, first_text_capacity, rest_text_capacity,
                             first_component_capacity, rest_component_capacity):
              """Pack text into Discord messages (lists of ("text", str)/("sep", None) pieces) under Discord's per-message limits."""
              atom_capacity = max(min(first_text_capacity, rest_text_capacity), MIN_CHUNK)

              atoms = []  # (text, starts_a_new_heading_section)
              for line in text.split("\n"):
                  pieces = split_long_line(line, atom_capacity)
                  heading = is_heading_line(line)
                  for i, piece in enumerate(pieces):
                      atoms.append((piece, heading and i == 0))

              messages = []
              current_msg = []
              current_text = []
              msg_text_len = 0
              msg_component_count = 0
              text_capacity = max(first_text_capacity, MIN_CHUNK)
              component_capacity = max(first_component_capacity, 1)
              first_atom = True

              def close_text():
                  nonlocal msg_component_count
                  if current_text:
                      current_msg.append(("text", "\n".join(current_text)))
                      current_text.clear()
                      msg_component_count += 1

              def close_message():
                  nonlocal msg_text_len, msg_component_count, text_capacity, component_capacity
                  close_text()
                  if current_msg:
                      messages.append(list(current_msg))
                      current_msg.clear()
                  msg_text_len = 0
                  msg_component_count = 0
                  text_capacity = max(rest_text_capacity, MIN_CHUNK)
                  component_capacity = max(rest_component_capacity, 1)

              for atom_text, starts_heading in atoms:
                  if starts_heading and not first_atom:
                      pending_close_cost = 1 if current_text else 0
                      projected_components = msg_component_count + pending_close_cost + 1  # +1 for the separator
                      if (msg_text_len + len(atom_text) > text_capacity
                              or projected_components > component_capacity):
                          close_message()
                      else:
                          close_text()
                          current_msg.append(("sep", None))
                          msg_component_count += 1
                      current_text.append(atom_text)
                      msg_text_len += len(atom_text)
                  else:
                      joined_len = len(atom_text) + (1 if current_text else 0)
                      if msg_text_len + joined_len > text_capacity:
                          close_message()
                          current_text.append(atom_text)
                          msg_text_len += len(atom_text)
                      else:
                          current_text.append(atom_text)
                          msg_text_len += joined_len
                  first_atom = False

              close_message()
              return messages or [[("text", text)]]


          def send_release(release, ping, note=None, ping_mode=None, ping_id=None):
              tag, release_url, author, notes = release_meta(release)

              title = f"## {PROJECT_NAME} Updated!"
              meta_lines = (
                  f"**Version:** {tag}\n"
                  f"**Author:** {author}\n"
                  f"**Release:** {release_url}"
              )
              meta_block = f"{note}\n\n{meta_lines}" if note else meta_lines

              ping_text, ping_mentions = build_ping(ping_mode, ping_id) if ping else ("", {})

              notes_heading = "## Release Notes:"
              first_overhead = len(ping_text) + len(title) + len(meta_block) + len(notes_heading)
              first_text_capacity = TOTAL_MESSAGE_BUDGET - first_overhead
              rest_text_capacity = TOTAL_MESSAGE_BUDGET - CONTINUATION_LABEL_OVERHEAD
              first_component_capacity = MAX_TOTAL_COMPONENTS - FIRST_FIXED_COMPONENTS
              rest_component_capacity = MAX_TOTAL_COMPONENTS - CONTINUATION_FIXED_COMPONENTS

              messages = pack_messages(
                  notes, first_text_capacity, rest_text_capacity,
                  first_component_capacity, rest_component_capacity,
              )
              total = len(messages)

              for index, pieces in enumerate(messages, start=1):
                  components = []
                  mentions = {}
                  if index == 1 and ping_text:
                      components.append({"type": 10, "content": ping_text})
                      mentions = ping_mentions

                  container = []
                  if index == 1:
                      container.append({"type": 10, "content": title})
                      container.append({"type": 14, "spacing": 1})
                      container.append({"type": 10, "content": meta_block})
                      container.append({"type": 14, "spacing": 1})
                      heading_prefix = notes_heading
                  else:
                      heading_prefix = f"## Release Notes (continued) — Part {index}/{total}:"

                  first_text_done = False
                  for kind, content in pieces:
                      if kind == "sep":
                          container.append({"type": 14, "spacing": 2})
                      else:
                          if not first_text_done:
                              content = f"{heading_prefix}\n{content}"
                              first_text_done = True
                          container.append({"type": 10, "content": content})

                  components.append({"type": 17, "components": container})
                  send_discord(components, mentions)


          def monitor_repository(repo, project_name, ping_mode, ping_id):
              configure_repository(repo, project_name)
              ping_sent = False

              releases = get_recent_releases()
              if not releases:
                  print(f"No published releases found for {REPO}.")
                  return ping_sent

              latest_tag = releases[0].get("tag_name", "").strip()
              old_tag = STATE.read_text().strip() if STATE.exists() else ""

              if latest_tag == old_tag:
                  print(f"No new release for {REPO}.")
                  return ping_sent

              STATE.parent.mkdir(parents=True, exist_ok=True)

              if not old_tag:
                  if not NOTIFY_ON_INITIAL_RUN:
                      STATE.write_text(latest_tag + "\n")
                      print(f"First run for {REPO}: recording the latest release without sending a notification.")
                      return ping_sent
                  new_releases = [releases[0]]
                  gap = False
              else:
                  tag_index = {r.get("tag_name", "").strip(): i for i, r in enumerate(releases)}
                  if old_tag in tag_index:
                      new_releases = releases[:tag_index[old_tag]]
                      new_releases.reverse()
                      gap = False
                  else:
                      new_releases = [releases[0]]
                      gap = True

              overflow = 0
              if len(new_releases) > MAX_RELEASES_PER_RUN:
                  overflow = len(new_releases) - MAX_RELEASES_PER_RUN
                  new_releases = new_releases[-MAX_RELEASES_PER_RUN:]

              print(
                  f"New releases to report for {REPO}: {len(new_releases)}"
                  + (f", {overflow} more not shown individually" if overflow else "")
                  + (", gap detected (older release not found in history)" if gap else "")
              )

              note = None
              if gap:
                  note = "_Could not find the last-seen release in recent history - showing the latest release only._"
              elif overflow:
                  note = f"_{overflow} earlier release(s) in this batch were not posted individually._"

              for i, release in enumerate(new_releases):
                  should_ping = not ping_sent
                  send_release(release, ping=should_ping, note=(note if i == 0 else None), ping_mode=ping_mode, ping_id=ping_id)
                  # Save after each release so a mid-batch failure cannot cause a repost.
                  STATE.write_text(release.get("tag_name", "").strip() + "\n")
                  if should_ping:
                      ping_sent = True

              print(f"Discord notification(s) sent and state saved for {REPO}.")
              return ping_sent


          def main():
              # Check the workflow-repository inactivity reminder once per run.
              maybe_send_inactivity_reminder()

              had_error = False
              # Each repository is processed only by the matching normal/forum workflow.
              for repo, project_name, repo_type, ping_mode, ping_id in parse_repositories(REPOS_RAW):
                  if repo_type != "normal":
                      continue
                  # Isolate failures per repo - one repo that 404s, times out, or is
                  # otherwise broken should not stop every repo listed after it from
                  # being checked, especially since this reruns every 5 minutes.
                  try:
                      monitor_repository(repo, project_name, ping_mode, ping_id)
                  except Exception as error:
                      had_error = True
                      print(f"Error while monitoring {repo}: {error}")

              if had_error:
                  # Still exit non-zero so the run shows as failed and is noticed,
                  # but only after every repo got its chance to be checked - state
                  # for the repos that succeeded is saved by the next step either way.
                  raise SystemExit(1)


          if __name__ == "__main__":
              main()
          PY

      - name: Save monitor state
        if: ${{ !cancelled() }}   # still commit partial progress if the previous step failed partway through a batch; skip only on cancellation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # State files are created only after a repository has been checked.
          # Do not fail the workflow if there are no state files yet.
          if [ -d "$STATE_DIR" ]; then
            git add -A -- "$STATE_DIR"
          fi

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update monitor state ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          # Retry the rebase+push a few times: if another monitor workflow run
          # (e.g. this template's forum-channel counterpart, which shares the
          # same default concurrency group) pushes to this branch at the same
          # moment, a single pull+push can lose the race. Each state file is
          # repo-specific, so there's never a real conflict to resolve here -
          # just a timing window to retry through.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              echo "State pushed successfully."
              exit 0
            fi
            echo "Push attempt $attempt/5 failed, retrying..."
            sleep $((attempt * 3))
          done

          echo "::error::Failed to push state update after multiple attempts."
          exit 1

      - name: Save 59-day inactivity reminder state
        if: ${{ !cancelled() && steps.monitor.outputs.reminder_sent == 'true' && steps.inactivity-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .github/.workflow-inactivity-reminder.marker
          key: ${{ steps.inactivity.outputs.cache_key }}
